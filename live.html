Cultivation:Bi,bonePerPoint:qi,attributeMin:Oi,attributeMax:Pi,startRerolls:Fi,logLimit:zi,breakthroughFailLoss:Yi,mindLossReduction:Ji,priceRefItemId:Hi,eventIntervalMin:Ui,eventIntervalMax:Wi,fortuneGoodWeight:Di,daoYunFirstTimeMult:Gi,nameMaxLength:Ki,offlineMaxHours:Zi,offlineMaxYears:Vi,offlineMinSeconds:Qi,offlineStopLifespanRatio:Xi,offlineRetreatTierYears:eo},no=[{id:"lianqi_full",name:"練氣圓滿",desc:"把練氣九層一路修到頭。",group:"cultivation",minLives:0,condition:{kind:"realm",realmId:"lianqi",stage:8}},{id:"reach_zhuji",name:"築基有成",desc:"破開第一道大關。",group:"cultivation",minLives:1,condition:{kind:"realm",realmId:"zhuji"}},{id:"reach_jindan",name:"金丹一粒",desc:"凝出金丹，算是真正入了門。",group:"cultivation",minLives:3,condition:{kind:"realm",realmId:"jindan"}},{id:"age_60",name:"活過六十",desc:"凡人能熬到的歲數，不見得比修士少。",group:"life",minLives:0,condition:{kind:"age",years:60}},{id:"age_100",name:"活過百歲",desc:"白髮多了，故事也多了。",group:"life",minLives:2,condition:{kind:"age",years:100}},{id:"one_fragment",name:"得一份殘卷",desc:"路上撿到的字紙，偶爾比丹藥值錢。",group:"story",minLives:0,condition:{kind:"fragments",count:1}},{id:"ten_events",name:"見聞十事",desc:"不挑好壞，多看幾件事。",group:"story",minLives:0,condition:{kind:"events",count:10}},{id:"raise_child",name:"養大一個孩子",desc:"收養的孩子長大成人，不算修行，卻也是一生。",group:"story",minLives:0,condition:{kind:"flag",flagId:"child_grown"}}],io=JSON.parse('[{"id":"cave_001","type":"choice","highlight":2,"title":"山中古洞","text":"你在採藥途中發現一處被藤蔓遮蔽的洞口，洞內隱隱有靈氣流出。","weight":10,"tone":"good","conditions":{"realmMin":"lianqi","ageMin":16,"flagsNot":["cave_001_done"]},"choices":[{"text":"入洞一探","outcomes":[{"weight":60,"text":"石台上置一玉瓶，瓶身古篆斑駁。你屏息啟封，內有丹藥一顆，另附字條：「存放三百年，藥效自負。」","effects":{"items":{"juqi_dan":1},"flags":["cave_001_done"]}},{"weight":30,"text":"洞內空無一物，只餘蛛網與積塵。白走一趟，倒也落得清靜。","effects":{"flags":["cave_001_done"]}},{"weight":10,"text":"洞中妖獸暴起，你重傷而逃。","effects":{"lifespan":-5,"flags":["cave_001_done"]}}]},{"text":"記下位置，日後再來","outcomes":[{"weight":100,"text":"你在洞外的山石上刻下記號。","effects":{"flags":["cave_001_marked"]}}]}]},{"id":"cave_002","type":"choice","highlight":4,"title":"重返古洞","text":"你循著記號重返古洞。這一次，洞深處有微光閃動，似是一處久封的洞府。","weight":15,"tone":"good","conditions":{"realmMin":"lianqi","flags":["cave_001_marked"]},"choices":[{"text":"深入洞府","outcomes":[{"weight":50,"text":"石室之中，前人留有一卷殘篇與幾枚靈石。你參悟數日，修為大進。","effects":{"cultivation":0.35,"spiritStones":40}},{"weight":20,"text":"石室禁制猶在，靈光一閃，你被震出洞外，修為受損。","effects":{"cultivation":-0.15}},{"weight":10,"text":"石壁暗格之中，靜靜躺著一枚丹藥，靈氣內斂，色澤溫潤。","effects":{"items":{"zhuji_dan":1}}},{"weight":20,"text":"石室中空空如也，唯壁上刻著一行小字：「道在腳下。」你默然良久，退出洞外。","effects":{"attributes":{"mind":1}}}]},{"text":"封洞離去","outcomes":[{"weight":100,"text":"你將洞口重新掩好，轉身離去。此洞留給後來人罷。","effects":{"attributes":{"fortune":1}}}]}]},{"id":"senior_001","type":"choice","highlight":2,"title":"路遇老者","text":"山道旁，一位白髮老者拄杖而立，自稱乾糧遺失，想向你討口吃食。","weight":8,"tone":"good","conditions":{"ageMin":14},"choices":[{"text":"分他乾糧","outcomes":[{"weight":100,"text":"老者接過乾糧，連聲道謝，臨走前多看了你兩眼。","effects":{"flags":["senior_helped"]}}]},{"text":"贈他靈石","requires":{"spiritStones":10},"outcomes":[{"weight":100,"text":"老者推辭再三，終究收下。他望著你，目光裡有幾分你看不懂的東西。","effects":{"spiritStones":-10,"attributes":{"fortune":1},"flags":["senior_helped"]}}]},{"text":"視而不見","outcomes":[{"weight":100,"text":"你繞道而行，身後傳來幾聲輕嘆，大約是風。","effects":{}}]}]},{"id":"senior_002","type":"choice","highlight":4,"title":"老者回贈","text":"多年之後，你在市集上遇見當年那位老者。他衣衫依舊樸素，氣度卻已大不相同。","weight":15,"tone":"good","conditions":{"ageMin":20,"flags":["senior_helped"]},"choices":[{"text":"上前行禮","outcomes":[{"weight":55,"text":"老者含笑點頭，指點了你幾句吐納之法。你依言而行，只覺氣機通暢許多。","effects":{"cultivation":0.3,"attributes":{"insight":1}}},{"weight":30,"text":"老者從袖中取出幾枚丹藥，道是當年一飯之謝。","effects":{"items":{"juqi_dan":2}}},{"weight":15,"text":"老者贈你一枚金紋丹藥，道是延年之物，請你珍重。","effects":{"items":{"yanshou_dan":1}}}]},{"text":"裝作未見","outcomes":[{"weight":100,"text":"你低頭疾行，與老者擦肩而過。背後無人喚你。","effects":{}}]}]},{"id":"market_001","type":"choice","title":"坊市異販","text":"坊市角落，一名攤主壓低聲音，說他手中有一枚祖傳的玉符，只賣有緣人。","weight":10,"tone":"neutral","conditions":{"ageMin":14},"choices":[{"text":"買下玉符","requires":{"spiritStones":30},"outcomes":[{"weight":40,"text":"玉符入手溫潤，內蘊一縷靈氣，確非凡品。","effects":{"spiritStones":-30,"cultivation":0.2}},{"weight":60,"text":"回去細看，玉符原是尋常頑石，打磨得頗為光亮。攤主說的有緣人，大約指的就是你。","effects":{"spiritStones":-30}}]},{"text":"一笑置之","outcomes":[{"weight":100,"text":"你拱手謝過，轉身離去。","effects":{}}]}]},{"id":"beast_001","type":"choice","highlight":1.5,"title":"山道遇獸","text":"山道轉角處，一頭灰狼低伏於草叢，目光冷冷地盯著你。","weight":8,"tone":"bad","maxPerLife":2,"conditions":{"realmMin":"lianqi"},"scheduleWeights":{"adventure":3},"choices":[{"text":"拔足便逃","outcomes":[{"weight":70,"text":"你一路狂奔，終於甩開了追蹤。回頭一看，那頭狼站在原處，連追的意思都沒有。","effects":{}},{"weight":30,"text":"你被追上，肩頭添了一道傷痕，休養許久才好。","effects":{"lifespan":-2}}]},{"text":"與之周旋","outcomes":[{"weight":52,"weightPerAttribute":{"bone":4},"text":"你屏息斂神，與灰狼對峙良久，終使其退去。經此一役，心境略有長進。","effects":{"attributes":{"mind":1}}},{"weight":45,"text":"纏鬥之中你負傷不輕，所幸保住性命。","effects":{"lifespan":-4}},{"weight":3,"text":"利爪掠過咽喉，一切歸於黑暗。","effects":{"death":true}}]},{"text":"繞路而行","outcomes":[{"weight":100,"text":"你悄悄退出數十步，另覓小徑，一路平安。","effects":{}}]},{"text":"迎上去，硬接一擊","requires":{"attributes":{"bone":7}},"outcomes":[{"weight":60,"text":"你架臂擋住撲來的灰狼，震得虎口發麻，那畜生竟先退了。","effects":{"attributes":{"bone":1}}},{"weight":40,"text":"你擋住了第一下，沒擋住第二下，肩頭掛了彩。","effects":{"lifespan":-2}}]}]},{"id":"demon_001","type":"choice","title":"心魔擾神","text":"靜坐之際，眼前忽現舊日景象，耳邊低語不絕，似有人在勸你放下。","weight":6,"tone":"bad","conditions":{"realmMin":"lianqi","ageMin":20},"choices":[{"text":"守住靈台","outcomes":[{"weight":20,"weightPerAttribute":{"mind":8},"text":"你默誦清心訣，心頭漸靜，低語如潮水般退去。","effects":{"cultivation":0.1}},{"weight":60,"text":"心魔入侵，氣血逆行，你嘔出一口血來，修為受損。","effects":{"cultivation":-0.2}}]},{"text":"順其自然","outcomes":[{"weight":100,"text":"你任由景象流轉，睜眼時天已大亮，人無大礙，只是平白耗去一夜。","effects":{}}]},{"text":"睜眼直視心魔","requires":{"attributes":{"mind":7}},"outcomes":[{"weight":80,"text":"你看著那些景象一一走過，它們便如舊屋裡的灰，一吹就散。","effects":{"cultivation":0.12}},{"weight":20,"text":"景象走得慢了些，你多耗了半夜。","effects":{}}]}]},{"id":"village_001","type":"choice","title":"山村求助","text":"山村裡的老人攔住你，說村口古井近日冒出黑水，牲畜病死不少，求你看看。","weight":9,"tone":"good","maxPerLife":2,"conditions":{},"choices":[{"text":"查看古井","outcomes":[{"weight":60,"text":"你在井底摸出一塊沁了陰氣的黑石，取出後井水轉清。村人感念，湊了幾枚靈石相贈。","effects":{"spiritStones":15}},{"weight":30,"text":"井下有物，你一時不察，被陰氣所侵，病了數月。","effects":{"lifespan":-2}},{"weight":10,"text":"井中並無異狀，不過是上游落了死鼠。你說完，村人的臉色比井水還黑。","effects":{}}]},{"text":"出錢請人清井","requires":{"spiritStones":20},"outcomes":[{"weight":100,"text":"你出錢請村人清井，事畢村中老幼皆來道謝。","effects":{"spiritStones":-20,"attributes":{"fortune":1}}}]},{"text":"婉言謝絕","outcomes":[{"weight":100,"text":"你推說另有要事，離開了山村。身後的炊煙看起來有些冷清。","effects":{}}]}]},{"id":"fortune_001","type":"choice","title":"道旁算命","text":"道旁一名盲眼卜者朝你招手，說你印堂有光，願為你算上一卦。","weight":8,"tone":"neutral","conditions":{"ageMin":14},"choices":[{"text":"請他算一卦","requires":{"spiritStones":15},"outcomes":[{"weight":50,"text":"卜者掐指良久，說你近年有貴人相助。你將信將疑，倒也安心了幾分。","effects":{"spiritStones":-15,"attributes":{"fortune":1}}},{"weight":30,"text":"卜者說你命格奇特，卻不肯多言，只收了錢。","effects":{"spiritStones":-15}},{"weight":20,"text":"他說你命中有劫，須破財消災，於是又收了你一份。","effects":{"spiritStones":-25}}]},{"text":"婉言拒絕","outcomes":[{"weight":100,"text":"你笑著擺手，從他身旁走過。他在身後輕輕嘆了口氣。","effects":{}}]}]},{"id":"elder_001","type":"choice","title":"前輩坐化","text":"荒崖石窟之中，一具枯骨盤膝而坐，指間仍扣著一隻儲物袋。","weight":6,"tone":"neutral","conditions":{"realmMin":"lianqi"},"scheduleWeights":{"adventure":2.5},"choices":[{"text":"取走儲物袋","outcomes":[{"weight":50,"text":"袋中有數枚靈石與一瓶丹藥，想來前輩不會介意。","effects":{"spiritStones":30,"items":{"juqi_dan":1}}},{"weight":30,"text":"袋口一開，殘餘禁制反噬，你被震得氣血翻湧。","effects":{"cultivation":-0.1}},{"weight":20,"text":"袋中別無他物，只有一張字條：「莫貪。」","effects":{"attributes":{"mind":1}}}]},{"text":"就地掩埋","outcomes":[{"weight":100,"text":"你將枯骨安葬，默誦一遍往生咒。山風過處，似有誰輕輕道了聲謝。","effects":{"attributes":{"fortune":1}}}]}]},{"id":"alchemist_001","type":"choice","title":"丹師求藥","text":"路旁一位丹師愁眉不展，說爐火正旺，卻缺一味尋常藥材，問你可否割愛。","weight":8,"tone":"good","conditions":{"realmMin":"lianqi"},"choices":[{"text":"取出藥材相贈","outcomes":[{"weight":70,"text":"丹師大喜，以一枚丹藥相酬，說是物盡其用。","effects":{"items":{"juqi_dan":1}}},{"weight":30,"text":"丹師收下藥材，匆匆趕回丹爐，連那句多謝都是邊跑邊喊的。","effects":{}}]},{"text":"婉言推辭","outcomes":[{"weight":100,"text":"你只說藥材另有用處，丹師點點頭，轉身走了。","effects":{}}]}]},{"id":"rival_001","type":"choice","title":"散修爭奪","text":"崖邊一株靈草初熟，一名散修也看中了它。兩人隔著數步，誰也沒有先動。","weight":8,"tone":"bad","maxPerLife":2,"conditions":{"realmMin":"lianqi"},"scheduleWeights":{"adventure":2},"choices":[{"text":"搶先出手","outcomes":[{"weight":50,"text":"你搶先一步將靈草收入囊中，對方悻悻而去。","effects":{"cultivation":0.15}},{"weight":50,"text":"對方出手更快，你只搶到半截草葉，還順帶挨了一掌。","effects":{"lifespan":-1}}]},{"text":"提議分食","outcomes":[{"weight":100,"text":"你提議對半分，對方略一思索便應了。兩人各取一半，相視一笑，各自走遠。","effects":{"cultivation":0.08}}]},{"text":"讓給對方","outcomes":[{"weight":100,"text":"你拱手相讓。對方道了聲謝，轉身走得比來時快多了。","effects":{"attributes":{"fortune":1}}}]}]},{"id":"mountain_001","type":"anecdote","highlight":1.5,"title":"山澗靜坐","text":"你於山澗旁靜坐三日，忽有所悟。起身時方知，所悟者不過是腿麻了。","weight":10,"tone":"neutral","maxPerLife":2,"conditions":{"ageMin":14}},{"id":"rain_001","type":"anecdote","title":"夜雨","text":"夜雨敲窗，你盤膝聽了一宿。天明雨歇，只覺胸中一片澄明。","weight":8,"tone":"good","maxPerLife":3,"conditions":{"realmMin":"lianqi"},"effects":{"cultivation":0.03}},{"id":"sword_001","type":"anecdote","title":"劍光掠空","text":"一道劍光自天際掠過，轉瞬不見。你立在原地望了許久，頸子都酸了。","weight":6,"tone":"neutral","maxPerLife":2,"conditions":{}},{"id":"wedding_001","type":"anecdote","title":"鄉里嫁娶","text":"鄉里有戶人家嫁女，鑼鼓喧天，你被拉去喝了一杯喜酒。酒是濁的，人情卻是熱的。","weight":10,"tone":"neutral","maxPerLife":2,"conditions":{"realmMax":"mortal","ageMin":12}},{"id":"furnace_001","type":"anecdote","title":"丹爐失火","text":"路過一處丹房，忽聽轟然一響，濃煙自窗中冒出。丹師滿臉烏黑地衝出來，手裡還緊攥著一株藥草。","weight":6,"tone":"neutral","maxPerLife":2,"conditions":{"realmMin":"lianqi"}},{"id":"aging_001","type":"anecdote","title":"年歲","text":"銅鏡之中，鬢邊不知何時添了幾縷白髮。你怔了片刻，將鏡子扣回案上。","weight":8,"tone":"neutral","maxPerLife":2,"conditions":{"ageMin":60}},{"id":"dream_001","type":"anecdote","highlight":1.5,"title":"夢中舊事","text":"夜裡你夢見一座從未到過的古寺，鐘聲悠遠。醒來時，枕邊濕了一小片。","weight":6,"tone":"neutral","conditions":{"ageMin":20}},{"id":"bottleneck_001","type":"anecdote","title":"瓶頸之嘆","text":"你立於關隘之前，靈氣盈滿卻無處可去。這一步看似只差一線，卻比千里更遠。","weight":20,"tone":"neutral","maxPerLife":3,"conditions":{"bottleneck":true}},{"id":"bookstall_001","type":"choice","highlight":2,"title":"舊書攤","text":"{market}的一處地攤上，堆著半人高的舊紙，攤主說論斤賣，不論內容。","weight":9,"tone":"neutral","conditions":{"ageMin":14,"fragmentAvailable":3},"choices":[{"text":"蹲下細翻","outcomes":[{"weight":30,"text":"你翻了半個時辰，從一堆黃曆與藥方中抽出一份殘缺的文書。攤主瞥了一眼，說這份算添頭。","effects":{"fragment":{"maxTier":3}}},{"weight":70,"text":"翻來翻去，盡是黃曆與藥方，指尖倒沾了一層灰。","effects":{}}]},{"text":"買下一捆","requires":{"spiritStones":8},"outcomes":[{"weight":45,"text":"你買下一捆，回去拆開細看，竟夾著一份殘卷。","effects":{"spiritStones":-8,"fragment":{"maxTier":3}}},{"weight":55,"text":"拆開一看，全是作廢的當票。","effects":{"spiritStones":-8}}]},{"text":"不看了","outcomes":[{"weight":100,"text":"你搖搖頭走開，攤主連頭都沒抬。","effects":{}}]}]},{"id":"abandoned_cave_001","type":"choice","highlight":2,"title":"荒廢洞府","text":"{mountain}深處，一處荒廢的洞府半掩在荒草之間。石門早已碎裂，門楣上的字跡只剩一半。","weight":8,"tone":"neutral","maxPerLife":2,"conditions":{"realmMin":"lianqi","fragmentAvailable":3},"scheduleWeights":{"adventure":2},"choices":[{"text":"入內搜尋","outcomes":[{"weight":25,"text":"石室角落有一隻朽爛的木匣，匣底壓著一份尚未風化的文書。你小心取出，紙邊一碰即碎。","effects":{"fragment":{"maxTier":3}}},{"weight":40,"text":"牆縫裡摳出幾枚靈石，成色尚可。","effects":{"spiritStones":15}},{"weight":35,"text":"早被前人搜刮得乾乾淨淨，連蛛網都像是新織的。","effects":{}}]},{"text":"在洞口歇腳","outcomes":[{"weight":100,"text":"你在洞口歇了半日，一無所獲，倒也睡得安穩。","effects":{}}]},{"text":"舊物一律不碰，只抄壁上的字","requires":{"fragments":["f10"]},"outcomes":[{"weight":50,"text":"你想起某本日誌裡的規矩，洞中舊物原樣擱著，只抄了壁上的字。抄完之後，心裡反倒踏實了。","effects":{"attributes":{"mind":1}}},{"weight":50,"text":"你什麼也沒碰，什麼也沒帶走。洞裡很安靜。","effects":{}}]}]},{"id":"tongji_clearance_001","type":"choice","highlight":2,"title":"{merchant}清倉","text":"{market}的{merchant}門口，夥計正把一批陳年舊物搬出來清倉，高聲叫賣：「舊帳舊冊，一律從簡！」","weight":8,"tone":"neutral","conditions":{"ageMin":16,"fragmentAvailable":3},"choices":[{"text":"挑一份舊冊","requires":{"spiritStones":5},"outcomes":[{"weight":45,"text":"夥計收了錢，頭也不抬地遞來一份。「東西是真的，」他說，「就是沒人想看。」","effects":{"spiritStones":-5,"fragment":{"maxTier":3}}},{"weight":55,"text":"你拿到的是一冊舊年的米價，倒也算是行情。","effects":{"spiritStones":-5}}]},{"text":"站著聽叫賣","outcomes":[{"weight":100,"text":"你聽了一刻，夥計問你買不買，你說再看看。他的笑容當場收了。","effects":{}}]},{"text":"翻到供奉冊那一頁，指給夥計看","requires":{"fragments":["f06"]},"outcomes":[{"weight":60,"text":"夥計的笑容僵在臉上，默默把價錢抹了，另塞給你一小袋靈石，請你別再提。","effects":{"spiritStones":12}},{"weight":40,"text":"夥計看了一眼，說這頁是拓本，不作數。他說得很快，快得不太像實話。","effects":{}}]}]},{"id":"yedu_guest_001","type":"choice","highlight":2,"title":"{wanderers}行腳客","text":"一名行腳客借宿你處，自稱出身{wanderers}，夜裡與你聊到三更。","weight":7,"tone":"neutral","scheduleWeights":{"wander":3},"conditions":{"ageMin":16,"fragmentAvailable":3},"choices":[{"text":"備酒款待","requires":{"spiritStones":5},"outcomes":[{"weight":70,"text":"他喝得盡興，臨走時從行囊裡翻出一份舊文書，說是路上看膩了，送你解悶。","effects":{"spiritStones":-5,"fragment":{"id":"f02"}}},{"weight":30,"text":"他喝完就睡，天亮人已不見，酒壺倒是擺得整整齊齊。","effects":{"spiritStones":-5}}]},{"text":"只備茶水","outcomes":[{"weight":50,"text":"他念了一段口訣，你聽得入神，他便順手替你抄了一份。","effects":{"fragment":{"id":"f02"}}},{"weight":50,"text":"他說{wanderers}的人沒有姓名，只有口訣，隨後念了一段。你沒記住，他也沒再念第二遍。","effects":{}}]},{"text":"問他口訣裡那個名字","requires":{"fragments":["f09"]},"outcomes":[{"weight":50,"text":"行腳客沉默了很久，只說：「這個問題，我們這行不收錢，也不答。」他把茶喝完，替你把杯子洗了。","effects":{"attributes":{"mind":1}}},{"weight":50,"text":"他笑了笑，說知道的人都不開口，開口的人都不知道。","effects":{}}]}]},{"id":"taiheng_disciple_001","type":"choice","highlight":2,"title":"遺落的文書","text":"山道上，一名身著{guard}外門服飾的弟子行色匆匆，包袱鬆了口，掉出一份文書。他渾然不覺，已走遠了。","weight":7,"tone":"neutral","conditions":{"realmMin":"lianqi","fragmentAvailable":3},"choices":[{"text":"追上去還給他","outcomes":[{"weight":60,"text":"他接過文書，千恩萬謝，又從包袱底抽出一份舊紙，說這是同門不要的。","effects":{"fragment":{"id":"f01"}}},{"weight":40,"text":"他道了聲謝，轉身就走，連名字都沒留。","effects":{"attributes":{"fortune":1}}}]},{"text":"撿起來看看","outcomes":[{"weight":50,"text":"你展開讀了兩行，便知不該看。但已讀到的，總不能退回去。","effects":{"fragment":{"id":"f01"}}},{"weight":50,"text":"紙上全是外門的值日表，哪一階由誰來掃，寫得清清楚楚。","effects":{}}]},{"text":"追上去，問他階上的事","requires":{"fragments":["f08"]},"outcomes":[{"weight":60,"text":"他臉色一白，奪回文書便走，慌亂間掉了一顆丹藥在你腳邊。","effects":{"items":{"juqi_dan":1}}},{"weight":40,"text":"他裝作沒聽見，腳步卻快了一倍。","effects":{}}]}]},{"id":"old_house_001","type":"choice","highlight":2,"title":"老宅木匣","text":"{village}一處老宅久無人住，屋樑下垂著一隻舊木匣，匣鎖已銹。","weight":7,"tone":"neutral","conditions":{"fragmentAvailable":3},"choices":[{"text":"撬開木匣","outcomes":[{"weight":25,"text":"匣底壓著一份發黃的文書，邊角被蟲蛀去一塊。","effects":{"fragment":{"maxTier":3}}},{"weight":40,"text":"匣中只有一把算盤珠子，數來數去，少了兩顆。","effects":{}},{"weight":35,"text":"匣裡有幾枚舊錢，已不能通用，只好當作紀念。","effects":{"spiritStones":6}}]},{"text":"不動它","outcomes":[{"weight":100,"text":"你替它掩上門，木匣繼續掛在樑下，大約還能再掛幾十年。","effects":{}}]}]},{"id":"ferry_001","type":"choice","title":"渡口漲價","text":"{market}的渡口，船夫說今日水大，要加價。","weight":7,"tone":"neutral","maxPerLife":2,"scheduleWeights":{"wander":3},"conditions":{"ageMin":12},"choices":[{"text":"照價付錢","requires":{"spiritStones":3},"outcomes":[{"weight":100,"text":"船夫收了錢，穩穩送你過河。水其實不大。","effects":{"spiritStones":-3}}]},{"text":"涉水而過","outcomes":[{"weight":60,"text":"你踩著激流過河，衣衫盡濕，心神卻因此清醒了些。","effects":{"cultivation":0.05}},{"weight":40,"text":"水比看上去深，你被沖出老遠，爬上岸時只剩一隻鞋。","effects":{"lifespan":-1}}]},{"text":"在岸邊等水退","outcomes":[{"weight":100,"text":"你等了半日，水沒退，船夫的價錢倒是漲了。","effects":{}}]}]},{"id":"herb_cliff_001","type":"choice","title":"崖邊藥草","text":"你在{mountain}的背陰處發現一叢藥草，品相極佳，只是長在斷崖邊上。","weight":8,"tone":"neutral","maxPerLife":2,"conditions":{"realmMin":"lianqi"},"scheduleWeights":{"adventure":1.5,"herb":2},"choices":[{"text":"冒險採摘","outcomes":[{"weight":68,"weightPerAttribute":{"bone":3},"text":"你攀著岩縫採得整叢藥草，換得不少靈石，指尖被割了數道口子。","effects":{"spiritStones":30}},{"weight":29,"text":"腳下一滑，你抓住藤蔓才沒摔下去，藥草卻落入深谷。","effects":{"lifespan":-1}},{"weight":3,"text":"一聲驚呼之後，山谷重歸寂靜。","effects":{"death":true}}]},{"text":"取一半，留一半","outcomes":[{"weight":100,"text":"你只採外圍的一半，留了根。山裡的藥草，來年還會再長。","effects":{"spiritStones":12}}]},{"text":"徒手攀上去，整叢採下","requires":{"attributes":{"bone":6}},"outcomes":[{"weight":85,"text":"你手腳並用爬上斷崖，整叢藥草連根採下，換得不少靈石。","effects":{"spiritStones":30}},{"weight":15,"text":"你爬到一半抓空一把，滑下來擦破了手掌，藥草是沒採成。","effects":{"lifespan":-1}}]}]},{"id":"teahouse_001","type":"choice","title":"茶攤傳聞","text":"{market}的茶攤上，幾名散修正在高談闊論，從{guard}的新丹方，說到{merchant}的新價錢。","weight":8,"tone":"neutral","maxPerLife":2,"scheduleWeights":{"wander":3},"conditions":{"ageMin":14},"choices":[{"text":"坐下旁聽","requires":{"spiritStones":2},"outcomes":[{"weight":50,"text":"你聽出了些門道，起身時只覺得這杯茶沒白喝。","effects":{"spiritStones":-2,"attributes":{"insight":1}}},{"weight":50,"text":"你聽了一下午，帶回三條消息，其中兩條互相矛盾，第三條是茶錢。","effects":{"spiritStones":-2}}]},{"text":"不湊熱鬧","outcomes":[{"weight":100,"text":"你繞開茶攤，身後的爭論聲一直追到巷口。","effects":{}}]}]},{"id":"qi_disorder_001","type":"choice","title":"氣息紊亂","text":"運功至緊要處，丹田忽然一陣刺痛，氣息不聽使喚。","weight":6,"tone":"bad","maxPerLife":2,"conditions":{"realmMin":"lianqi"},"choices":[{"text":"強行運轉","outcomes":[{"weight":45,"text":"氣機衝撞經脈，你悶哼一聲，修為折損了一截。","effects":{"cultivation":-0.12}},{"weight":55,"weightPerAttribute":{"mind":5},"text":"你咬牙撐過，氣息漸漸歸順，心性也沉穩了些。","effects":{"attributes":{"mind":1}}}]},{"text":"收功調息","outcomes":[{"weight":100,"text":"你收功調息三日，損失不大，只是白耽誤了幾日工夫。","effects":{}}]},{"text":"順著經脈細察刺痛之處","requires":{"attributes":{"insight":7}},"outcomes":[{"weight":100,"text":"你循著刺痛一路細察，找出氣機岔開的那一處，順手撥正。","effects":{"cultivation":0.04}}]}]},{"id":"lost_child_001","type":"choice","title":"迷路孩童","text":"{village}的孩子在山腳下迷了路，哭得鼻涕直流。","weight":7,"tone":"good","maxPerLife":2,"conditions":{},"choices":[{"text":"送他回家","outcomes":[{"weight":60,"text":"孩子的娘塞給你一籃野果，你吃了三天。","effects":{"attributes":{"fortune":1}}},{"weight":40,"text":"孩子的爹誤當你是拐子，追了你半條街。說清楚後，他請你喝了一碗粥。","effects":{}}]},{"text":"替他指個方向","outcomes":[{"weight":100,"text":"你指了個方向，不知他走對了沒有。","effects":{}}]}]},{"id":"pill_dealer_001","type":"choice","title":"坊市賤賣","text":"{market}上有人兜售成色可疑的聚氣丹，價錢只要市價的一半。","weight":7,"tone":"neutral","maxPerLife":2,"conditions":{"realmMin":"lianqi"},"choices":[{"text":"買一顆試試","requires":{"spiritStones":10},"outcomes":[{"weight":45,"weightPerAttribute":{"insight":5},"text":"丹藥入口微苦，靈氣倒是真的，只是少了幾分火候。","effects":{"spiritStones":-10,"cultivation":0.12}},{"weight":55,"text":"咬開一看，是麵糰裹了藥渣。","effects":{"spiritStones":-10}}]},{"text":"當面揭穿他","outcomes":[{"weight":40,"text":"攤主面色一變，收攤便走。圍觀的人群裡有人向你點頭致意。","effects":{"attributes":{"fortune":1}}},{"weight":60,"text":"攤主指著你嚷嚷，說你壞他生意，人群起鬨，你只得悻悻離開。","effects":{}}]},{"text":"路過","outcomes":[{"weight":100,"text":"你從攤前走過，沒有回頭。","effects":{}}]},{"text":"照著舊手札的口氣，報出延壽丹的行情","requires":{"fragments":["f05"]},"outcomes":[{"weight":55,"text":"丹師的眼神變了，說這個價只有行內人才知道。他把一粒試丹塞進你手裡，沒收錢。","effects":{"cultivation":0.08}},{"weight":45,"text":"丹師說手札上的價早就變了，你報得不對。你也不知道是手札舊了，還是行情變了。","effects":{}}]}]},{"id":"windblown_page_001","type":"anecdote","highlight":1.5,"title":"風中殘頁","text":"一陣山風捲來一張殘頁，正好貼在你臉上。紙已發黃，字跡尚可辨認。","weight":4,"tone":"good","conditions":{"fragmentAvailable":3},"effects":{"fragment":{"maxTier":3,"chance":0.3}}},{"id":"wall_writing_001","type":"anecdote","highlight":1.5,"title":"牆上舊字","text":"荒屋斷牆上，殘留著前人以炭寫下的幾行字。你湊近讀了一遍，抄在隨身的紙上。","weight":4,"tone":"neutral","conditions":{"realmMin":"lianqi","fragmentAvailable":3},"effects":{"fragment":{"maxTier":3,"chance":0.3}}},{"id":"pawnshop_001","type":"anecdote","highlight":1.5,"title":"當鋪舊物","text":"{market}的當鋪櫃檯下壓著一疊無人贖回的舊物，掌櫃隨手抽出一份塞給你，說抵你方才多問的那句話。","weight":4,"tone":"neutral","conditions":{"ageMin":16,"fragmentAvailable":3},"effects":{"fragment":{"maxTier":3,"chance":0.3}}},{"id":"herb_paper_001","type":"anecdote","highlight":1.5,"title":"包藥的紙","text":"藥鋪夥計用一張舊紙替你包藥。你拆開時，發現紙上的字比藥方有意思得多。","weight":4,"tone":"neutral","conditions":{"realmMin":"lianqi","fragmentAvailable":3},"effects":{"fragment":{"maxTier":3,"chance":0.3}}},{"id":"children_song_001","type":"anecdote","highlight":1.5,"title":"孩子的歌謠","text":"{village}的孩子們唱著一支你沒聽過的歌謠，你湊近聽了兩遍，順手抄了下來。","weight":4,"tone":"neutral","conditions":{"ageMin":12,"fragmentAvailable":3},"effects":{"fragment":{"maxTier":3,"chance":0.3}}},{"id":"cold_tea_001","type":"anecdote","title":"涼茶","text":"你泡的茶涼了三回，才想起忘了喝。靈氣倒是走了三個周天。","weight":8,"tone":"neutral","maxPerLife":2,"conditions":{"realmMin":"lianqi"}},{"id":"stone_bridge_001","type":"anecdote","title":"石橋","text":"{village}村口的石橋又被山水沖掉一塊，村人說這是第三回，下回準備改用木板。","weight":7,"tone":"neutral","maxPerLife":2,"conditions":{}},{"id":"crow_001","type":"anecdote","title":"烏鴉","text":"一隻烏鴉停在窗沿，歪頭看了你半晌，又飛走了。你不確定自己被評判了什麼。","weight":7,"tone":"neutral","maxPerLife":2,"conditions":{}},{"id":"orphan_001","type":"choice","highlight":2,"title":"路邊棄嬰","text":"{village}的田埂邊，一隻舊竹籃裡躺著一名嬰孩，哭聲已經啞了。四下無人認領。","weight":30,"tone":"good","conditions":{"ageMin":20,"ageMax":45,"flagsNot":["orphan_done"]},"choices":[{"text":"抱回去養","outcomes":[{"weight":100,"text":"你把嬰孩抱回住處，笨手笨腳地煮了一鍋米湯。從此屋裡多了一份牽掛。","effects":{"spiritStones":-8,"attributes":{"mind":1},"flags":["orphan_adopted","orphan_done"]}}]},{"text":"託給{village}的人家","requires":{"spiritStones":5},"outcomes":[{"weight":100,"text":"村裡的婦人接過嬰孩，說這事交給她。你留下幾枚靈石便走了。","effects":{"spiritStones":-5,"flags":["orphan_done"]}}]},{"text":"只當沒看見","outcomes":[{"weight":100,"text":"你站了一會兒，終究還是走開。這件事在心裡擱了很多年。","effects":{"flags":["orphan_done"]}}]}]},{"id":"orphan_002","type":"choice","highlight":2,"title":"少年劈柴","text":"當年那名嬰孩已經長成少年，在你屋前劈柴，劈得歪歪斜斜。他問你，修仙是不是一件很難的事。","weight":50,"tone":"good","conditions":{"ageMin":60,"flags":["orphan_adopted"],"flagsNot":["orphan_002_done"]},"choices":[{"text":"教他吐納","outcomes":[{"weight":60,"text":"你教了他最基本的吐納法。他學得認真，只是三天打魚，兩天曬網。","effects":{"cultivation":0.03,"flags":["child_grown","orphan_002_done"]}},{"weight":40,"text":"他學了半月便說志不在此，轉身去學木工。你也沒再勉強。","effects":{"attributes":{"mind":1},"flags":["child_grown","orphan_002_done"]}}]},{"text":"讓他自己選","outcomes":[{"weight":100,"text":"你只說路是自己走的。他想了很久，答了一句：「那我先劈完這些柴。」","effects":{"flags":["child_grown","orphan_002_done"]}}]}]},{"id":"orphan_003","type":"anecdote","highlight":4,"title":"孩子成家","text":"孩子成了家，在{village}落了戶。每逢年節，他都提著一籃東西來看你，你說不必，卻從沒讓他空手回去。","weight":50,"tone":"good","conditions":{"ageMin":90,"flags":["child_grown"]},"effects":{"attributes":{"mind":1}}},{"id":"scholar_001","type":"choice","highlight":2,"title":"借宿書生","text":"夜雨之中，一名書生渾身濕透，敲開你的門，說想借宿一晚，行囊裡全是書。","weight":30,"tone":"good","conditions":{"ageMin":18,"ageMax":50,"flagsNot":["scholar_done"]},"choices":[{"text":"讓他進來","outcomes":[{"weight":100,"text":"他睡前把濕書一頁頁攤在屋裡晾乾，滿屋墨味。天亮他拱手而去，說日後必當回報。","effects":{"flags":["scholar_hosted","scholar_done"]}}]},{"text":"遞把傘打發他","outcomes":[{"weight":100,"text":"他接過傘道了謝，轉身走進夜雨裡。你關上門，屋裡仍是清清靜靜。","effects":{"flags":["scholar_done"]}}]}]},{"id":"scholar_002","type":"choice","highlight":3,"title":"書生回贈","text":"年老的書生拄杖尋到你門前，說當年一宿之恩，他記了這麼多年。行囊裡還是書。","weight":50,"tone":"good","conditions":{"ageMin":70,"flags":["scholar_hosted"],"flagsNot":["scholar_002_done"],"fragmentAvailable":3},"choices":[{"text":"請他進屋","outcomes":[{"weight":55,"text":"他從行囊底翻出一份舊紙，說是遊學時所得，字他看不懂，也許你看得懂。","effects":{"flags":["scholar_002_done"],"fragment":{"maxTier":3}}},{"weight":45,"text":"他與你對坐一夜，講的全是些他自己也不全信的舊聞。","effects":{"attributes":{"insight":1},"flags":["scholar_002_done"]}}]},{"text":"婉言謝過","outcomes":[{"weight":100,"text":"你謝過他的好意。他點點頭，把書放回行囊，慢慢走遠了。","effects":{"flags":["scholar_002_done"]}}]}]},{"id":"friend_001","type":"choice","highlight":2,"title":"舊友來訪","text":"少時一同玩泥巴的舊友路過{village}，特意來看你。他如今是{market}的小掌櫃，衣著光鮮。","weight":30,"tone":"neutral","conditions":{"ageMin":25,"ageMax":50,"flagsNot":["friend_done"]},"choices":[{"text":"留他吃頓飯","outcomes":[{"weight":65,"text":"你們喝了一夜，聊的全是小時候的事。他臨走塞給你幾枚靈石，說是舊情價。","effects":{"spiritStones":10,"flags":["friend_met","friend_done"]}},{"weight":35,"text":"席間他提起生意的艱難，你聽著聽著，才發覺他是來借錢的。","effects":{"spiritStones":-10,"flags":["friend_met","friend_done"]}}]},{"text":"託詞閉關","outcomes":[{"weight":100,"text":"你隔著門說正在閉關。他在門外站了一會兒，留下一包點心便走了。","effects":{"flags":["friend_done"]}}]}]},{"id":"friend_002","type":"anecdote","highlight":3,"title":"舊友訃告","text":"有人捎來消息，說{market}那位舊友已經過世。你在門前站了很久，想起他少時總愛把泥巴捏成小人，說要捏一個神仙。","weight":50,"tone":"neutral","conditions":{"ageMin":80,"flags":["friend_met"]},"effects":{"attributes":{"mind":1}}},{"id":"recruit_001","type":"choice","highlight":1.5,"title":"石壁告示","text":"山道旁的石壁上貼著告示，{guard}招收雜役弟子，管吃管住，年紀不拘。","weight":30,"tone":"neutral","conditions":{"realmMin":"lianqi","ageMin":30,"ageMax":60,"flagsNot":["recruit_done"]},"choices":[{"text":"上前詢問","outcomes":[{"weight":50,"text":"負責登記的弟子上下打量你，說名額早滿了，下次再來。他說這話時沒抬頭。","effects":{"flags":["recruit_asked","recruit_done"]}},{"weight":50,"text":"弟子說可以，只是要先繳一筆保證金。你摸了摸錢袋，默默退了出來。","effects":{"flags":["recruit_asked","recruit_done"]}}]},{"text":"看看就走","outcomes":[{"weight":100,"text":"你把告示從頭看到尾，連蓋章的位置都記住了，然後走開。","effects":{"flags":["recruit_done"]}}]}]},{"id":"recruit_002","type":"anecdote","highlight":2,"title":"再過石壁","text":"多年後你再經過那面石壁，告示已換了新的。當年那名登記的弟子，如今成了{guard}的執事，身後跟著兩名新來的雜役。他沒認出你，你也沒打招呼。","weight":50,"tone":"neutral","conditions":{"ageMin":90,"flags":["recruit_asked"]}},{"id":"youth_fight_001","type":"anecdote","title":"為了蟋蟀","text":"{village}的孩子們為了一隻蟋蟀打了一架，你被推進泥塘。回家時渾身臭泥，卻是最後笑得最大聲的那個。","weight":30,"tone":"neutral","conditions":{"ageMax":17}},{"id":"youth_qi_001","type":"anecdote","highlight":1.5,"title":"丹田微暖","text":"夜裡盤坐，丹田處忽然有一點暖意，像冬天裡藏在袖中的炭。你屏息等了很久，它卻不再出現。","weight":30,"tone":"good","conditions":{"ageMin":11,"ageMax":22},"effects":{"attributes":{"insight":1}}},{"id":"youth_teacher_001","type":"choice","title":"私塾先生","text":"{village}的私塾先生攔住你，說你識字快，勸你好好讀書，莫要整日望著山發呆。","weight":30,"tone":"neutral","conditions":{"ageMin":10,"ageMax":20},"choices":[{"text":"聽先生的，讀幾年書","outcomes":[{"weight":100,"text":"你在私塾坐了兩年，學會了把一句話寫成五句。先生滿意，山也沒跑。","effects":{"attributes":{"insight":1}}}]},{"text":"還是想修行","outcomes":[{"weight":100,"text":"你鞠了一躬，說志在山上。先生嘆了口氣，塞給你一本舊書，說路上解悶。","effects":{"attributes":{"mind":1}}}]},{"text":"兩頭都不誤","outcomes":[{"weight":50,"text":"你白天讀書，夜裡吐納，兩頭都學了個半吊子。","effects":{}},{"weight":50,"text":"先生考你背書，你背到一半睡著了。","effects":{}}]}]},{"id":"youth_harvest_001","type":"choice","title":"秋收","text":"秋收時節，鄰家缺人手，托你幫忙搶收。你的功課還沒做完。","weight":30,"tone":"neutral","conditions":{"ageMin":12,"ageMax":24},"choices":[{"text":"去幫忙","outcomes":[{"weight":60,"text":"你割了三天稻，腰痠得像是練過一套功法。鄰家給了兩袋米和一籃雞蛋。","effects":{"spiritStones":6}},{"weight":40,"text":"你割了三天稻，腰痠得直不起來，過幾日卻覺得筋骨比往常結實了些。鄰家給了兩袋米。","effects":{"spiritStones":6,"attributes":{"bone":1}}}]},{"text":"回去修行","outcomes":[{"weight":100,"text":"你關起門吐納三日，鄰家的稻子是別人幫著割完的。他們嘴上沒說什麼。","effects":{"cultivation":0.05}}]}]},{"id":"marriage_001","type":"choice","title":"媒人上門","text":"媒人踏破了門檻，說{village}東頭有戶人家的姑娘，性子好，手也巧。","weight":14,"tone":"neutral","conditions":{"ageMin":24,"ageMax":50,"flagsNot":["marriage_done"]},"choices":[{"text":"見一面","outcomes":[{"weight":60,"text":"見面時茶涼了兩回，話沒說上幾句，卻也不覺得不自在。後來親事沒成，倒多了一個說話的人。","effects":{"attributes":{"fortune":1},"flags":["marriage_done"]}},{"weight":40,"text":"對方問你一年能賺多少靈石，你答不出來，這門親事便沒了下文。","effects":{"flags":["marriage_done"]}}]},{"text":"婉言拒絕","outcomes":[{"weight":100,"text":"你說修行為重，媒人嘆著氣走了，下次來得好像更勤。","effects":{"flags":["marriage_done"]}}]}]},{"id":"debt_001","type":"choice","title":"親戚借貸","text":"遠房親戚登門，說{village}今年收成不好，想向你借些靈石周轉，字據都帶來了。","weight":10,"tone":"neutral","maxPerLife":2,"conditions":{"ageMin":26,"ageMax":80},"choices":[{"text":"借給他","requires":{"spiritStones":15},"outcomes":[{"weight":50,"text":"他年底如數歸還，另添了一籃自家種的菜。你吃了半個月。","effects":{"spiritStones":3}},{"weight":50,"text":"字據收進抽屜，很多年沒再拿出來看過。","effects":{"spiritStones":-15}}]},{"text":"推說手頭緊","outcomes":[{"weight":100,"text":"你說修行人哪有積蓄。親戚信了一半，走時門關得有點重。","effects":{}}]}]},{"id":"flood_001","type":"choice","highlight":2,"title":"河水暴漲","text":"連日大雨，{village}一帶河水暴漲，田舍被淹了一半，鄰里在屋頂上喊人。","weight":5,"tone":"bad","conditions":{"ageMin":20},"choices":[{"text":"下水救人","outcomes":[{"weight":56,"weightPerAttribute":{"bone":4},"text":"你在水裡來回十幾趟，救出好幾戶人家，自己也病了一場。事後村裡湊了些東西謝你。","effects":{"lifespan":-2,"spiritStones":12,"attributes":{"fortune":1}}},{"weight":41,"text":"水勢太急，你救出兩人便被沖到下游，躺了很久才爬起來。","effects":{"lifespan":-3}},{"weight":3,"text":"一個浪頭打來，你沒能再浮上來。","effects":{"death":true}}]},{"text":"在高處喊人來","outcomes":[{"weight":100,"text":"你在高處喊了半夜，嗓子啞了，人倒是都被找來了。","effects":{}}]},{"text":"守在家中打坐","outcomes":[{"weight":100,"text":"水退之後，你的屋子竟安然無恙。鄰里看你的目光有些複雜。","effects":{"cultivation":0.03}}]},{"text":"背著人涉水而出","requires":{"attributes":{"bone":7}},"outcomes":[{"weight":70,"text":"你踩著水底的石頭，一趟背出一戶人家，竟不覺得累。事後有人往你屋裡送了些吃用。","effects":{"spiritStones":8,"attributes":{"bone":1}}},{"weight":30,"text":"你背出幾戶人家便力竭，在高處歇了半日。","effects":{"lifespan":-1}}]}]},{"id":"market_fire_001","type":"anecdote","title":"鋪子失火","text":"{market}的一排鋪子夜裡失了火，所幸人都跑了出來。第二天，燒焦的門板後面照常有人在賣東西。","weight":7,"tone":"neutral","conditions":{"ageMin":16}},{"id":"neighbor_001","type":"anecdote","title":"隔牆之爭","text":"鄰居家的雞又飛進了你的院子，你和鄰居隔著牆討論了一個時辰，最後的結論是各退一步。","weight":8,"tone":"neutral","maxPerLife":2,"conditions":{"ageMin":18}},{"id":"last_wish_001","type":"choice","highlight":2,"title":"身後之物","text":"暮色裡你把一生的物件翻出來看了一遍，不知該留給誰，也不知該不該留。","weight":25,"tone":"neutral","conditions":{"ageMin":90},"choices":[{"text":"分給{village}的人","outcomes":[{"weight":100,"text":"你把東西分給村裡的老少，換來好幾個頭磕得咚咚響。","effects":{"attributes":{"fortune":1}}}]},{"text":"一把火燒了","outcomes":[{"weight":100,"text":"火光映在牆上，一生的痕跡燒得乾乾淨淨。你忽然覺得輕了些。","effects":{"attributes":{"mind":1}}}]},{"text":"原樣收回箱底","outcomes":[{"weight":100,"text":"你把它們原樣放回去。有些事，等不到答案也是一種答案。","effects":{}}]}]},{"id":"old_home_001","type":"anecdote","highlight":1.5,"title":"舊居","text":"你回到{village}的舊居，院牆塌了一角，院中的老樹卻比記憶裡更高。你在樹下坐了一會兒，樹沒有說話。","weight":25,"tone":"neutral","conditions":{"ageMin":70}},{"id":"grave_001","type":"anecdote","title":"掃墓","text":"你替幾位故人的墳頭拔了草。墳前的字跡風化了不少，你猜再過幾年，大約也沒人認得出來了。","weight":20,"tone":"neutral","maxPerLife":2,"conditions":{"ageMin":80}},{"id":"zhuji_lonely_001","type":"anecdote","highlight":1.5,"title":"座席空了","text":"同輩的修行者多半已經不在了。你偶爾還會對著空座位說一句話，自己聽了都覺得好笑。","weight":8,"tone":"neutral","conditions":{"realmMin":"zhuji"}},{"id":"zhuji_elder_001","type":"choice","title":"長老過門","text":"{guard}的一位長老路過你的居處，在門口站了站，似乎在等你先開口。","weight":7,"tone":"neutral","conditions":{"realmMin":"zhuji"},"choices":[{"text":"上前見禮","outcomes":[{"weight":50,"text":"長老點了點頭，隨口指點了幾句，說的都是你早已知道的事，只是他說得更慢。","effects":{"cultivation":0.04}},{"weight":50,"text":"長老只問你的道號，你報上，他說了聲「哦」，便走了。","effects":{}}]},{"text":"裝作未見","outcomes":[{"weight":100,"text":"你低頭掃地。長老站了一會兒，也走了。","effects":{}}]}]},{"id":"zhuji_junior_001","type":"choice","title":"後輩求教","text":"一位年輕的散修登門求教，問了一長串問題，大半是你二十年前問過別人的。","weight":7,"tone":"good","conditions":{"realmMin":"zhuji"},"choices":[{"text":"耐心解答","outcomes":[{"weight":70,"text":"你講了一個下午。他臨走道謝，說這番話比三年苦修有用。你不信，卻也受用。","effects":{"attributes":{"fortune":1}}},{"weight":30,"text":"你講到一半才發覺自己也有幾處講不通，只好說容後再議。","effects":{"attributes":{"mind":1}}}]},{"text":"婉言送客","outcomes":[{"weight":100,"text":"你說正在閉關，他恭敬地行了一禮退下。門關上之後，屋裡又恢復了安靜。","effects":{}}]}]},{"id":"zhuji_cave_001","type":"choice","highlight":1.5,"title":"舊洞重訪","text":"你循著記憶回到當年那處古洞，洞口的藤蔓已枯，石壁上多了幾道新刻的記號，顯然有人來過。","weight":6,"tone":"neutral","conditions":{"realmMin":"zhuji","flags":["cave_001_done"]},"choices":[{"text":"進洞再看","outcomes":[{"weight":40,"text":"洞中陳設依舊，角落裡多了一張舊蒲團，像是有人在此靜坐過。你坐了一會兒，神思清明。","effects":{"cultivation":0.04}},{"weight":60,"text":"洞裡空蕩蕩的，連當年那隻玉瓶的底座都被人搬走了。","effects":{}}]},{"text":"不進去","outcomes":[{"weight":100,"text":"你在洞口站了一會兒，轉身離去。有些地方，一次便夠。","effects":{}}]}]},{"id":"zhuji_border_001","type":"anecdote","highlight":1.5,"title":"邊界之爭","text":"{country}與鄰國為了邊界起了爭執，朝廷派人來請你出面鎮場。你在城樓上坐了三天，一句話沒說，兩邊便都散了。","weight":6,"tone":"neutral","conditions":{"realmMin":"zhuji"}},{"id":"zhuji_retreat_001","type":"anecdote","title":"出關","text":"你一次閉關十年，出關時山下的茶攤已換了三任掌櫃。新的那位問你要點什麼，你想了很久，說：茶。","weight":6,"tone":"neutral","conditions":{"realmMin":"zhuji","ageMin":130}},{"id":"temple_wall_001","type":"anecdote","highlight":1.5,"title":"荒廟題記","text":"{mountain}下的一座荒廟裡，斑駁的壁畫之間夾著幾行工整的題記。你一字一句抄了下來。","weight":5,"tone":"neutral","conditions":{"ageMin":14,"fragmentAvailable":3},"effects":{"fragment":{"maxTier":3,"chance":0.35}}},{"id":"ferryman_scroll_001","type":"choice","highlight":2,"title":"船夫的舊紙","text":"{market}的老船夫在渡口邊補網，船艙裡堆著一捆泛黃的紙，他說是歷任客人落下的。","weight":5,"tone":"neutral","scheduleWeights":{"wander":3},"conditions":{"ageMin":16,"fragmentAvailable":3},"choices":[{"text":"問他能不能看看","outcomes":[{"weight":40,"text":"他說隨便看，只要別弄濕。你翻了半晌，抽出一份尚能辨認的。","effects":{"fragment":{"maxTier":3}}},{"weight":60,"text":"盡是些船票與貨單，連字都被水泡得糊了。","effects":{}}]},{"text":"幫他補網","outcomes":[{"weight":45,"text":"你陪他補了一下午網。他把紙推給你，說拿去罷，反正我也不認得。","effects":{"fragment":{"maxTier":3}}},{"weight":55,"text":"網補好了，他請你喝了碗熱湯，紙卻沒再提。","effects":{}}]},{"text":"不打擾","outcomes":[{"weight":100,"text":"你向他點點頭，沿著岸邊走開了。","effects":{}}]}]},{"id":"old_chest_001","type":"choice","highlight":2,"title":"搬家的舊箱","text":"{village}一戶人家搬家，院裡堆著要丟的舊箱，主人說誰要誰拿。","weight":5,"tone":"neutral","conditions":{"fragmentAvailable":3},"choices":[{"text":"翻一翻","outcomes":[{"weight":30,"text":"箱底壓著一份發黃的文書，邊角被蟲蛀去一塊。","effects":{"fragment":{"maxTier":3}}},{"weight":40,"text":"夾層裡摸出幾枚舊錢，已不能通用，只好當作紀念。","effects":{"spiritStones":4}},{"weight":30,"text":"盡是些舊衣和斷了柄的剪刀。","effects":{}}]},{"text":"幫忙搬家","outcomes":[{"weight":100,"text":"你幫著搬了半天，主人塞給你幾枚靈石道謝。","effects":{"spiritStones":5}}]}]},{"id":"gate_tea_001","type":"anecdote","title":"山門前的茶棚","text":"{guard}的山門關了，山腳的茶棚反倒生意興隆，等著進山的人坐滿了條凳。你坐下來聽了半個下午的閒話，沒聽到一句準話。","weight":10,"tone":"neutral","conditions":{"realmMin":"lianqi","world":["guard_closed"]}},{"id":"gate_market_001","type":"choice","title":"門內流出的丹藥","text":"{market}的巷尾，有人低聲說手上有一顆從{guard}門內流出來的築基丹，價錢比坊市便宜些。","weight":8,"tone":"neutral","conditions":{"realmMin":"lianqi","ageMin":20,"world":["guard_closed"]},"choices":[{"text":"買下","requires":{"spiritStones":300},"outcomes":[{"weight":55,"text":"丹藥是真的，包藥的紙上還蓋著山門的印。","effects":{"spiritStones":-300,"items":{"zhuji_dan":1}}},{"weight":45,"text":"回去一剝，裡頭是蜜丸，賣丹的人早已不見了。","effects":{"spiritStones":-300}}]},{"text":"問他丹是從哪裡流出來的","outcomes":[{"weight":100,"text":"賣丹的人看了你一眼，轉身就走，走得比來時快。","effects":{}}]},{"text":"不理他","outcomes":[{"weight":100,"text":"你繞過巷口，沒有回頭。","effects":{}}]}]},{"id":"branch_sign_001","type":"anecdote","title":"新招牌","text":"{merchant}在{market}的分號換了新招牌，夥計說今年各地都在換，字是同一個師傅寫的。","weight":8,"tone":"neutral","conditions":{"ageMin":14,"world":["merchant_wide"]}},{"id":"ferry_broken_001","type":"choice","title":"斷渡","text":"渡口毀了，擺渡人蹲在岸邊修船，說至少要等月餘。往來的客商都堵在這裡。","weight":8,"tone":"neutral","conditions":{"ageMin":14,"world":["ferries_broken"]},"choices":[{"text":"幫著搬貨","outcomes":[{"weight":100,"text":"你替客商搬了半日的貨，工錢是幾塊靈石。","effects":{"spiritStones":8}}]},{"text":"就地打坐等船","outcomes":[{"weight":100,"text":"你在岸邊坐了數日，等船的事漸漸忘了。","effects":{"cultivation":0.03}}]},{"text":"繞道而行","outcomes":[{"weight":100,"text":"你繞了遠路，山水倒是看了不少。","effects":{}}]}]},{"id":"wander_boatman_001","type":"choice","title":"渡口的老船夫","text":"渡口的石階上坐著一位老船夫，煙袋鍋子在手裡轉了好幾圈，看樣子是想找人說話。","weight":14,"tone":"neutral","maxPerLife":2,"conditions":{"schedules":["wander"],"fragmentAvailable":3},"choices":[{"text":"請他喝一碗","requires":{"spiritStones":3},"outcomes":[{"weight":45,"text":"他喝了酒，話匣子開了。說到一半從懷裡摸出一張舊紙，說是客人落下的，沒人來取。","effects":{"spiritStones":-3,"fragment":{"maxTier":3}}},{"weight":55,"text":"他喝完便睡了，鼾聲和江水聲是一個調子。","effects":{"spiritStones":-3}}]},{"text":"坐下來聽他說","outcomes":[{"weight":100,"text":"他說的都是舊年的水位和船價，聽得你昏昏欲睡。","effects":{}}]}]},{"id":"wander_crowd_001","type":"choice","title":"渡口人多","text":"渡口候船的人很多，有人在高聲議價，有人湊在一起低聲說話。","weight":14,"tone":"neutral","maxPerLife":2,"conditions":{"schedules":["wander"]},"choices":[{"text":"湊近聽低聲的那一群","outcomes":[{"weight":40,"text":"他們說的是{wanderers}的規矩。你沒全聽懂，但記住了幾個詞。","effects":{"attributes":{"insight":1}}},{"weight":60,"text":"他們看見你走近，話就停了，轉頭議起船價。","effects":{}}]},{"text":"替人看行李","outcomes":[{"weight":100,"text":"你替一位客人看了一個時辰的行李，得了幾塊靈石。","effects":{"spiritStones":6}}]}]},{"id":"wander_stranger_001","type":"anecdote","title":"渡口邊的行腳人","text":"渡口邊一個行腳的散修問你要不要結伴走一段。你說不必，他點點頭，沒有勉強。","weight":10,"tone":"neutral","conditions":{"schedules":["wander"]}},{"id":"jindan_visit_001","type":"anecdote","title":"路人叩拜","text":"山下的村民遠遠見你走過，齊齊跪下，口稱仙師。你想扶，又覺得扶起來他們更不安，便由著他們跪完了。","weight":7,"tone":"neutral","conditions":{"realmMin":"jindan"}},{"id":"jindan_peer_001","type":"anecdote","highlight":1.5,"title":"舊名冊","text":"你翻出當年同輩的名冊，一個個數過去，還能對上活人的，一個也沒有。你把名冊合上，放回原處。","weight":6,"tone":"neutral","conditions":{"realmMin":"jindan"}},{"id":"jindan_friend_001","type":"choice","title":"故人來訪","text":"一位白髮老者登門，自稱當年曾在你門外站過一個下午。你想了很久，才想起那是個十來歲的孩子。","weight":20,"tone":"neutral","conditions":{"realmMin":"jindan"},"choices":[{"text":"請他進來","outcomes":[{"weight":60,"text":"你們喝了一盞茶，話不多。他臨走時說，今生怕是不及再來了，你點點頭，沒有勸他。","effects":{"attributes":{"mind":1},"flags":["jindan_friend_hosted"]}},{"weight":40,"text":"他端著茶，只說了一句家常，便睡著了。你替他蓋了件衣裳，等他醒來。","effects":{"flags":["jindan_friend_hosted"]}}]},{"text":"隔門道謝","outcomes":[{"weight":100,"text":"你隔著門道了謝。腳步聲在門外停了一會兒，漸漸遠了。","effects":{"flags":["jindan_friend_declined"]}}]}]},{"id":"jindan_friend_002_hosted","type":"anecdote","highlight":3,"title":"舊茶盞","text":"一名自稱故人晚輩的人送來一只舊茶盞，說老人臨終前囑她還你。你認出杯沿那道缺口，收下了，沒有問她姓名。","weight":80,"tone":"neutral","conditions":{"realmMin":"jindan","flags":["jindan_friend_hosted"]}},{"id":"jindan_friend_002_declined","type":"anecdote","highlight":3,"title":"未封的信","text":"一名自稱故人晚輩的人送來一封未封的信。紙上只有一句「那日多謝」，你看了很久，才將它收起。","weight":80,"tone":"neutral","conditions":{"realmMin":"jindan","flags":["jindan_friend_declined"]}},{"id":"jindan_askway_001","type":"choice","title":"有人問路","text":"一位築基修士攔下你，問金丹之後還有什麼。他問得很認真，像是已經問過許多人。","weight":6,"tone":"neutral","conditions":{"realmMin":"jindan"},"choices":[{"text":"實話相告","outcomes":[{"weight":100,"text":"你說不知道。他愣了片刻，竟笑了，說這是他聽過最像樣的答案。","effects":{"attributes":{"mind":1}}}]},{"text":"隨口編一個","outcomes":[{"weight":100,"text":"你編了一個，聽起來頗有道理。他謝過你，走遠了，你忽然有些後悔。","effects":{}}]},{"text":"不答","outcomes":[{"weight":100,"text":"你搖搖頭，繼續趕路。他在原地站了很久。","effects":{}}]}]},{"id":"jindan_guard_001","type":"choice","title":"山門請帖","text":"{guard}遣人送來一張請帖，邀你赴山門論道。信寫得很客氣，客氣得沒有一句實話。","weight":20,"tone":"neutral","conditions":{"realmMin":"jindan"},"choices":[{"text":"赴約","outcomes":[{"weight":50,"text":"席間一位長老講起瓶頸，只說了兩句，你記到今日。","effects":{"attributes":{"insight":1},"flags":["jindan_guard_attended"]}},{"weight":50,"text":"席間話題始終繞著規矩與正統打轉。你聽了半日，什麼也沒帶走。","effects":{"flags":["jindan_guard_attended"]}}]},{"text":"婉拒","outcomes":[{"weight":100,"text":"你回信說近日不便。對方回得更客氣，彷彿鬆了口氣。","effects":{}}]}]},{"id":"jindan_guard_002","type":"anecdote","highlight":3,"title":"論道舊函","text":"一份當年論道的抄本輾轉到你手中。你認出自己在席間隨手寫下的兩個字，旁邊還有別人添的一句反駁。字跡都已褪色，問題還在。","weight":80,"tone":"neutral","conditions":{"realmMin":"jindan","flags":["jindan_guard_attended"]}},{"id":"jindan_merchant_001","type":"choice","title":"掌櫃作保","text":"{merchant}的掌櫃親自上門，想請你替一批貨作保。他說得誠懇，只是算盤一直沒有放下。","weight":6,"tone":"good","conditions":{"realmMin":"jindan"},"choices":[{"text":"應下","outcomes":[{"weight":80,"text":"貨平安到了。掌櫃付了酬金，數得一文不差。","effects":{"spiritStones":30}},{"weight":20,"text":"貨晚了三個月，掌櫃仍按約付了錢，只是下回再沒來找你。","effects":{"spiritStones":10}}]},{"text":"回絕","outcomes":[{"weight":100,"text":"你說自己不作保。掌櫃點頭，把算盤收進袖中。","effects":{}}]}]},{"id":"jindan_wander_001","type":"anecdote","title":"渡口認人","text":"{wanderers}的幾位散修在渡口邊認出了你，彼此使了個眼色，齊聲說不認識。你覺得這樣也好。","weight":6,"tone":"neutral","conditions":{"realmMin":"jindan"}},{"id":"jindan_dream_001","type":"anecdote","highlight":1,"title":"夢中渡口","text":"你夢見一處從未到過的渡口，船家對你點了點頭，像是等了很久。醒來時，窗外的月亮還在原處。","weight":5,"tone":"neutral","conditions":{"realmMin":"jindan"}},{"id":"jindan_cave_001","type":"choice","title":"舊洞府","text":"{mountain}深處有一處荒廢的洞府，門上的字跡你只認得一半，另一半像是被人刻意磨去。","weight":5,"tone":"neutral","conditions":{"realmMin":"jindan"},"choices":[{"text":"入內查看","outcomes":[{"weight":40,"text":"洞中空無一物，只有牆上幾道刻痕，數得出是計日用的。你數到最後一道，便不再數了。","effects":{"attributes":{"insight":1}}},{"weight":60,"text":"洞裡落滿塵土，連腳印都沒有。看來上一位訪客也是你這個年紀。","effects":{}}]},{"text":"在門外站一會兒","outcomes":[{"weight":100,"text":"你在門外站了一會兒，什麼也沒發生，這大概也算一種結果。","effects":{}}]}]},{"id":"jindan_pill_001","type":"choice","title":"丹師兜售","text":"一位老丹師帶著幾顆延壽丹上門，說專為年事已高的前輩準備，另有折扣。你不確定這個折扣是怎麼算的。","weight":5,"tone":"neutral","conditions":{"realmMin":"jindan"},"choices":[{"text":"買下一顆（一百五十靈石）","requires":{"spiritStones":150},"outcomes":[{"weight":100,"text":"丹師收了錢，千恩萬謝。藥效與市面上的並無兩樣，折扣大約只是客氣。","effects":{"spiritStones":-150,"lifespan":5}}]},{"text":"再看看","outcomes":[{"weight":100,"text":"你說再看看。丹師說前輩慢慢看，他明年再來。","effects":{}}]}]},{"id":"jindan_retreat_001","type":"anecdote","title":"出關三十年","text":"你一次閉關三十年，出關時山下的人家換了兩代。新來的那戶不認得你，仍舊在門口放了一碗水。","weight":6,"tone":"neutral","conditions":{"realmMin":"jindan","ageMin":250}},{"id":"jindan_country_001","type":"anecdote","highlight":1,"title":"禮單漸短","text":"{country}的君主換了三任，每一任都派使者送禮，禮單一任比一任短。你倒覺得這樣比較實在。","weight":5,"tone":"neutral","conditions":{"realmMin":"jindan"}},{"id":"jindan_bottleneck_001","type":"anecdote","highlight":1,"title":"窗前","text":"修為已滿，關隘紋絲不動。你在窗前坐了半日，想起練氣時也曾這樣坐過，只是那時的關隘近得多。","weight":8,"tone":"neutral","conditions":{"realmMin":"jindan","bottleneck":true}},{"id":"jindan_funeral_001","type":"choice","title":"訃告","text":"一位相識多年的築基修士壽元已盡，家人遞來訃告。你與他並無深交，只是他是少數還認得你的人。","weight":5,"tone":"neutral","conditions":{"realmMin":"jindan","ageMin":200},"choices":[{"text":"前往送行","outcomes":[{"weight":100,"text":"你在靈前站了一炷香。他的後人看你的眼神帶著敬畏，你不知該如何讓他們別這樣。","effects":{"attributes":{"mind":1}}}]},{"text":"託人帶話","outcomes":[{"weight":100,"text":"你託人帶了一句話。話很短，是你想了一夜的。","effects":{}}]}]},{"id":"jindan_tea_001","type":"anecdote","title":"茶攤孩童","text":"茶攤掌櫃的孫子仰頭問你，是不是真的活了三百歲。你說算不清了，這不是謙虛，只是懶得算。","weight":6,"tone":"neutral","conditions":{"realmMin":"jindan","ageMin":120}},{"id":"jindan_sword_001","type":"anecdote","title":"劍光","text":"一道劍光從頭頂掠過，你沒有抬頭。你只是記得，當年為了這樣一道光，羨慕了整整一天。","weight":5,"tone":"neutral","conditions":{"realmMin":"jindan"}},{"id":"jindan_dispute_001","type":"choice","title":"礦苗之爭","text":"兩名散修為了一處零星礦苗吵得面紅耳赤，聽說你路過，請你評理。他們都說自己先到，礦苗不發表意見。","weight":20,"tone":"neutral","conditions":{"realmMin":"jindan"},"choices":[{"text":"對半均分","outcomes":[{"weight":100,"text":"兩人都不滿意，卻都收下了。走時互相瞪著，倒像日後還會一起來。","effects":{"attributes":{"fortune":1},"flags":["jindan_dispute_split"]}}]},{"text":"判給先到者","outcomes":[{"weight":50,"text":"先到的那位千恩萬謝，後到的悶聲不響。你不確定誰先到，但裁決總得有人下。","effects":{"attributes":{"mind":1},"flags":["jindan_dispute_ruled"]}},{"weight":50,"text":"先到的那位其實是後到的，你後來才聽說。","effects":{"flags":["jindan_dispute_ruled"]}}]},{"text":"不插手","outcomes":[{"weight":100,"text":"你說這種事不該由外人斷。兩人悻悻而去，礦苗仍在原處。","effects":{}}]}]},{"id":"jindan_dispute_002_split","type":"anecdote","highlight":3,"title":"礦苗兩家","text":"當年分礦苗的兩名散修又攜手來訪，說後來各守半邊，竟一起挖出一條小脈。他們仍爭誰先看見，這回倒是笑著爭的。","weight":80,"tone":"neutral","conditions":{"realmMin":"jindan","flags":["jindan_dispute_split"]}},{"id":"jindan_dispute_002_ruled","type":"anecdote","highlight":3,"title":"礦苗舊案","text":"當年爭礦苗的兩名散修又同來見你，說那處礦脈早已挖盡，如今還有人拿你的裁決爭論。他們這回沒有請你再斷，只留下兩份互不相同的說法。","weight":80,"tone":"neutral","conditions":{"realmMin":"jindan","flags":["jindan_dispute_ruled"]}},{"id":"jindan_offering_001","type":"choice","title":"年年供品","text":"山下一個小門派年年派人送來供品，說是孝敬前輩。你從未答應過收，他們也從未停過。","weight":5,"tone":"good","conditions":{"realmMin":"jindan"},"choices":[{"text":"收下","outcomes":[{"weight":100,"text":"供品是些山貨與幾塊零星靈石。你收下之後，他們第二年又多送了一份。","effects":{"spiritStones":12}}]},{"text":"退回","outcomes":[{"weight":100,"text":"你讓來人把東西帶回去。他們鞠了躬，明年照樣來。","effects":{}}]}]}]'),oo={juetong:"絕通",sanjie:"三界與九境"},ro={taiheng:"{guard}",yedu:"{wanderers}",tongji:"{merchant}",youming:"輪迴司",shangjie:"上界",nameless:"□□",none:"無明確立場"},so=[{id:"f01",title:"{guard}誌・卷三",topic:"juetong",source:"宗誌",stance:"taiheng",era:"絕通後不久",tier:1,text:"守梯紀末，逆修□□強闖天門不得，遷怒毀梯。上界震怒，自此天人永隔。本宗奉天命鎮守殘階，迄今不敢稍懈。"},{id:"f02",title:"{wanderers}口訣",topic:"juetong",source:"口訣",stance:"yedu",era:"不詳",tier:1,text:"大宗把梯，一額一脈。□□登天，為眾人斷之。學道不必問門戶，過河何須等官船。"},{id:"f03",title:"蒙童三界歌",topic:"sanjie",source:"啟蒙讀物",stance:"none",era:"今世",tier:1,text:`天上住仙人，幽冥管輪迴，中間是咱們。
仙人不下來，鬼卒不上來。
咱們管吃飯，吃飽再說天。`},{id:"f04",title:"九境名目",topic:"sanjie",source:"殘抄",stance:"none",era:"今世",tier:1,text:`練氣、築基、金丹，此下三境。
元嬰、化神、煉虛，此中三境。
合體、大乘，上三境……
（以下墨跡模糊，旁有小字：「渡劫，或在大乘之前？」）`},{id:"f05",title:"候梯人手札",topic:"juetong",source:"手札",stance:"none",era:"絕通前四十年",tier:1,text:`排號第三十一年。管事說還要等，我說我等得起。
今早又服一顆延壽丹，掌櫃問要不要再訂三顆，我說訂。`},{id:"f06",title:"{merchant}舊帳・供奉冊",topic:"juetong",source:"帳本",stance:"tongji",era:"絕通前三十年起",tier:2,text:`絕通前三十年，代{guard}解送上界供奉，靈石八萬。回執：無。
絕通前二十九年，同上，靈石九萬。回執：無。
抄者按：以下二十八年皆同，不錄。`},{id:"f07",title:"{merchant}舊帳・名額冊",topic:"juetong",source:"帳本",stance:"tongji",era:"絕通前三十年起",tier:2,text:`絕通前三十年，名額一額，作價靈脈一條。登梯三人。

erLevel:.1,cost:{base:6,growth:1.8}},{id:"daoxin",name:"道心",desc:"道心愈堅，衝關失敗時所損愈少。",maxLevel:4,effect:"failLoss",perLevel:.05,cost:{base:12,growth:2},advice:{upTo:2,reason:"衝關失敗時少折損一些，築基丹的錢才不白花。"}},{id:"shenguang",name:"神光",desc:"道韻積得深了，神魂深處似乎有什麼在亮。",maxLevel:6,effect:"breakthroughAid",perLevel:1,cost:{base:250,growth:1.5}}],bo={stageUp:["靈氣在經脈中走完一個周天，你已至{realm}。","修為水到渠成，無驚無險，你已至{realm}。","丹田微微一震，似有一層薄膜應聲而破。你已至{realm}，只是無人在旁喝采。","吐納數月，忽覺氣機一順，你已至{realm}。"],realmUp:{lianqi:"引氣入體，天地靈氣自此為你所用。你踏上修行之路，已是{realm}。"},bottleneck:"修為已至圓滿，前路卻似隔了一層薄紙，怎麼也捅不破。",death:"{name}的這一世，至此落幕。",zuohua:"{name}尋了一處靜室，把剩下的壽元一併坐了進去。",breakthroughSuccess:{zhuji:"丹田之中靈氣如潮，百脈俱震。一炷香後，天地復歸寂靜。你已築基。",jindan:"周身靈氣盡數歸於丹田，凝為一點，圓融無缺。你已結成金丹。",yuanying:"神魂深處亮起一點微光，漸漸聚成一個小小的身影，睜開了眼。你已結成元嬰。"},breakthroughFail:["靈氣衝關而不得入，反噬經脈，修為折損不少。你調息數日，方才緩過氣來。","關隘紋絲不動，你卻被震得氣血翻湧，修為散去一截。","功虧一簣，丹田內靈氣潰散。那道關隘依舊立在原處，看起來並不著急。"],buy:["於坊市購得{item}。","於坊市購得{item}，囊中靈石輕了幾分。","於坊市購得{item}，掌櫃收錢的手比你出手還快。"],find:["途經荒僻之處，你於石縫間拾得{item}一顆。","山道旁枯草之下，藏著{item}一顆，不知是哪位前人遺落。"],adventureDeath:"外出歷練途中遭遇不測，你再也沒有回來。",retreat:{short:["你閉關數年，足不出戶，只管吐納。出關時日光刺眼，你在洞口站了好一會兒才適應。","洞府中歲月無聲，你只憑吐納的次數數著日子。出關後才知，世間又多了不少你全然不知的事。","數載靜修，心無旁騖，氣息比入定前沉穩許多。","你在石壁上刻痕記著年月，出關後一數，竟與實際差了一年。"],medium:["多年寒暑倏忽而過，洞外草木已非舊時模樣。你出關時，連下山的路都換了走法。","你閉關多年，氣息愈發內斂，連洞口的鳥雀也不再避你。","多年靜坐，衣上積塵，鬢邊微霜，所幸修為不曾辜負這些年月。","洞中不見日月，你只憑靈氣流轉推算時辰。推算的結果是，你大概錯過了不少事，而且都與你無關。"],long:["你這一關便是漫長歲月，出關時洞府石階已生滿青苔。外頭的人事想必換過一輪，無人記得你曾閉關。","漫長歲月一晃而過，洞口的蛛網結了又破，破了又結。你出關時，它們看起來比你更有耐心。","久閉之後，你的吐納已與天地同拍，連時間的流逝也變得遲鈍。","多年不問世事，你出關後第一件事，是試著想起自己上次開口說話是什麼時候。想不起來。"],stop:{bottleneck:["只是修為已至圓滿，再閉下去也不過是空坐。","只是那道關隘仍立在前頭，你在它面前坐了許久，它也沒讓開。"],lifespan:["只是壽元所剩不多，你終究收了功，不敢再把歲月耗在洞中。","再閉下去，怕是要在洞中直接坐化，你識趣地停了下來。"]}}},$o={opening:["{era}年間，你{years}，離開了舊居，往修行這條路上走去。","{era}年間，人間無事可記。你{years}，開始吐納。","{era}年間，你{years}，頭一回認真盤膝坐下。街坊說你坐得像模像樣，不知是不是誇獎。","{era}年間，塵世裡的人照常生老病死，你選了另一條路。路長，且少有人同行。"],transition:"{prev}年間之後，隔了不知多少年，如今是{era}年間。",born:"生於{era}年間"},yo={gate:"已走到{realm}，再進一步需{talent} {n} 級，還差 {k} 級。",preview:"升到 {n} 級：{effect}",sho
