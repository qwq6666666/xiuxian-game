<html lang="zh-Hant">

<title>地圖原型（維諾圖格網）</title>
<style>

  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:15px/1.6 "Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif; }

  .wrap > * { margin-bottom:10px; }
  h1 { font-size:16px; margin:0 0 4px; }
  canvas { display:block; width:100%; max-width:100%; height:auto; border-radius:6px; cursor:crosshair; }
  label { display:flex; align-items:center; gap:8px; margin:4px 0; color:var(--text); }
  input[type=range] { width:100%; accent-color:var(--accent); }
  input[type=number], select { background:var(--bg); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:6px 8px; font:inherit; }
  button { background:var(--accent); color:#1b1b1b; border:0; border-radius:6px; padding:8px 12px; font:inherit; font-weight:700; cursor:pointer; min-height:38px; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--line); }
  .bar { display:flex; flex-wrap:wrap; gap:8px; }
  .tg { margin:0; }
  .tg input { position:absolute; opacity:0; pointer-events:none; }
  .tg span { display:inline-block; padding:8px 14px; min-height:40px; border:1px solid var(--line); border-radius:999px; background:var(--panel); color:var(--muted); cursor:pointer; user-select:none; }
  .tg input:checked + span { background:#3a3220; border-color:var(--accent); color:var(--text); }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:12px 14px; min-height:7.2em; }
  .card .it { font-size:17px; font-weight:700; margin-bottom:2px; }
  .card small { font-weight:400; color:var(--muted); font-size:13px; }
  .card .g { color:#d6a428; font-weight:700; }
  .card .r { color:#d25046; font-weight:700; }
  details { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:10px 14px; }
  summary { cursor:pointer; color:var(--accent); min-height:28px; }
  .gen { display:flex; flex-wrap:wrap; align-items:flex-end; gap:8px 10px; }
  .mini { display:flex; flex-direction:column; gap:2px; margin:0; font-size:12px; color:var(--muted); }
  .mini input[type=number] { width:96px; } .mini select { width:112px; }
  .mini.wide { flex:1 1 150px; } .mini.wide input { width:100%; }
  .legend { display:grid; grid-template-columns:1fr 1fr; gap:4px 10px; font-size:13px; }
  .chip { display:flex; align-items:center; gap:6px; }
  .sw { width:14px; height:14px; border-radius:3px; border:1px solid #0006; flex:none; }
  .muted { color:var(--muted); font-size:13px; }
</style>
</head>

  <p class="muted" style="margin:0">地形、省、國家全部是同一批維諾格的集合；河流沿格邊流向鄰格；邊緣加雜訊與細分，讓稜角變成有機的線。</p>

    <label class="mini">種子<input id="seed" type="number" value="7"></label>
    <button id="roll">重擲</button>
    <label class="mini">輪廓<select id="mode"><option value="fixed">九渡洲</option><option value="random">隨機大陸</option></select></label>
    <label class="mini wide">國家數：<b id="pv">6</b><input id="p" type="range" min="3" max="8" step="1" value="6"></label>
    <label class="mini wide">省數（國界格）：<b id="nv">80</b><input id="n" type="range" min="30" max="100" step="10" value="80"></label>
    <label class="mini wide">地形格數：<b id="cv">3500</b><input id="c" type="range" min="1500" max="6000" step="500" value="3500"></label>
  </div>
  <canvas id="map"></canvas>
  <div class="bar">
    <label class="tg"><input type="checkbox" id="L_nation" checked><span>國家</span></label>
    <label class="tg"><input type="checkbox" id="L_terrain" checked><span>地形</span></label>
    <label class="tg"><input type="checkbox" id="L_river" checked><span>河流</span></label>
    <label class="tg"><input type="checkbox" id="L_sect" checked><span>宗門靈脈</span></label>
    <label class="tg"><input type="checkbox" id="L_symbol" checked><span>山林符號</span></label>
    <label class="tg"><input type="checkbox" id="L_cells"><span>顯示格線</span></label>
  </div>
  <div class="card" id="info"></div>
  <details><summary>圖例與統計</summary><div class="legend" id="legend" style="margin:8px 0"></div><div class="muted" id="stat"></div></details>
</div>

      g.lineWidth = 2; g.beginPath(); g.arc(px0, py0, r, 0, Math.PI * 2); g.fillStyle = s.state === "prosper" ? "rgba(44,32,22,.95)" : s.state === "closed" ? "rgba(140,140,140,.95)" : "rgba(244,232,196,.95)"; g.setLineDash(s.state === "decline" ? [3, 3] : []); g.fill(); g.stroke(); g.setLineDash([]);
      if (s.state === "fallen") { g.strokeStyle = "rgba(160,40,32,1)"; g.beginPath(); g.moveTo(px0 - r, py0 - r); g.lineTo(px0 + r, py0 + r); g.moveTo(px0 + r, py0 - r); g.lineTo(px0 - r, py0 + r); g.stroke(); }
      g.font = '600 12px "Noto Serif TC","Songti TC",serif'; g.textAlign = "left"; g.textBaseline = "middle"; g.letterSpacing = "0px"; g.lineWidth = 3; g.strokeStyle = "rgba(240,226,184,.85)"; g.strokeText(s.name, px0 + r + 5, py0); g.fillStyle = "rgba(44,32,22,.95)"; g.fillText(s.name, px0 + r + 5, py0);
    }
  }
  // 國名與都城
  const sx = new Float64Array(P.polities.length), sy = new Float64Array(P.polities.length), sn = new Float64Array(P.polities.length);
  for (const c of CD.cells) { const k = P.cellPol[c.id]; if (k < 0) continue; sx[k] += c.x; sy[k] += c.y; sn[k]++; }
  g.textAlign = "center"; g.textBaseline = "middle";
  P.polities.forEach((pol, k) => {
    if (!sn[k]) return; let cx = sx[k] / sn[k], cy = sy[k] / sn[k], best = null, bd = 1e9;
    for (const c of CD.cells) if (P.cellPol[c.id] === k) { const q = (c.x - cx) ** 2 + (c.y - cy) ** 2; if (q < bd) { bd = q; best = c; } } if (best) { cx = best.x; cy = best.y; }
    const sz = clamp(13 + Math.sqrt(sn[k] * CD.d * CD.d * 4) / 3.4, 20, 50);
    g.font = `700 ${sz}px "Noto Serif TC","Songti TC","PMingLiU",serif`; g.letterSpacing = sz * 0.14 + "px"; g.lineWidth = 4; g.strokeStyle = "rgba(240,226,184,.65)"; g.strokeText(pol.name, X(cx), X(cy)); g.fillStyle = `rgba(${pol.color[0] * 0.38 | 0},${pol.color[1] * 0.3 | 0},${pol.color[2] * 0.3 | 0},.9)`; g.fillText(pol.name, X(cx), X(cy));
    const cc = CD.cells[P.seeds[pol.cap]]; g.letterSpacing = "0px"; g.fillStyle = "rgba(50,38,28,.95)"; g.beginPath(); g.arc(X(cc.x), X(cc.y), 3.2, 0, Math.PI * 2); g.fill(); g.beginPath(); g.arc(X(cc.x), X(cc.y), 6, 0, Math.PI * 2); g.strokeStyle = "rgba(50,38,28,.8)"; g.lineWidth = 1.2; g.stroke();
    g.font = '600 13px "Noto Serif TC","Songti TC",serif'; g.lineWidth = 3; g.strokeStyle = "rgba(240,226,184,.8)"; g.strokeText(pol.city, X(cc.x), X(cc.y) + 17); g.fillStyle = "rgba(50,38,28,.95)"; g.fillText(pol.city, X(cc.x), X(cc.y) + 17);
  });
  // 外框與刻度
  g.strokeStyle = "rgba(40,30,20,.9)"; g.lineWidth = 2; g.strokeRect(M, M, OW, OH); g.lineWidth = 1; g.strokeRect(M - 7, M - 7, OW + 14, OH + 14); g.strokeRect(M - 11, M - 11, OW + 22, OH + 22);
  g.fillStyle = "rgba(60,46,32,.85)"; g.font = "10px serif"; g.textAlign = "center"; g.textBaseline = "middle"; g.letterSpacing = "0px";
  for (let x = 0; x <= OW; x += 80) { const v = (-90 + x / OW * 180).toFixed(1) + "°"; g.fillText(v, M + x, 8); g.fillText(v, M + x, CH - 8); }
  for (let y = 0; y <= OH; y += 80) { const v = (47 - y / OH * 94).toFixed(1) + "°"; g.save(); g.translate(8, M + y); g.rotate(-Math.PI / 2); g.fillText(v, 0, 0); g.restore(); g.save(); g.translate(CW - 8, M + y); g.rotate(Math.PI / 2); g.fillText(v, 0, 0); g.restore(); }
  updateInfo();
}

// ---------- 六、資訊卡與點選 ----------
function strengthOf(id) { const own = POL.owner.filter(o => o === id).length, al = POL.sects.filter(s => s.ally === id && s.reach > 0); return (own / POL.n * 10 + al.filter(s => s.state === "prosper").length + al.filter(s => s.state !== "prosper").length * 0.5).toFixed(1); }
function updateInfo() {
  const el = document.getElementById("info"), pn = id => POL.polities[id].name, gold = t => `<span class="g">互惠</span> ${t}`, red = t => `<span class="r">世仇</span> ${t}`;
  if (!sel) { el.innerHTML = `<div class="it">九渡洲<small>　${POL.polities.length} 國・${POL.sects.length} 宗門</small></div><div>點選國家、宗門或任一格，看詳情。</div><div class="muted">互惠 ${POL.sects.filter(s => s.ally >= 0).length} 組・世仇 ${POL.sects.filter(s => s.feud >= 0).length} 組</div>`; return; }
  if (sel.type === "sect") { const s = POL.sects[sel.id]; el.innerHTML = `<div class="it">${s.name}<small>　${rankName(s)}・${STATE_NAME[s.state]}</small></div><div>位於${pn(s.host)}境內</div><div>${s.ally >= 0 ? gold(pn(s.ally)) : "互惠 —"}　${s.feud >= 0 ? red(pn(s.feud)) : "世仇 —"}</div>`; return; }
  const c = CD.cells[sel.cell], pol = POL.polities[sel.id], mine = POL.sects.filter(s => s.host === pol.id).length, al = POL.sects.filter(s => s.ally === pol.id).map(s => s.name).join("、") || "—", fe = POL.sects.filter(s => s.feud === pol.id).map(s => s.name).join("、") || "—";
  const e = TER.E[c.id], t = TER.T[c.id], m = TER.Mo[c.id];
  el.innerHTML = `<div class="it">${pol.name}<small>　國勢 ${strengthOf(pol.id)}・境內宗門 ${mine} 家</small></div><div>${gold(al)}</div><div>${red(fe)}</div><div class="muted">格 #${c.id}（省 #${POL.prov[c.id]}）：${TER.lake[c.id] ? "湖泊" : BIOMES[biomeOf(e, t, m)].name}・${climateWord(t)}${wetWord(m)}・海拔約 ${Math.round(e * 2800)} 公尺・${TER.acc[c.id] > 22 ? "有河流經過" : "遠離大河"}</div>`;
}
canvas.addEventListener("click", ev => {
  if (!CD) return; const r = canvas.getBoundingClientRect(), sc = CW / r.width, gx = ((ev.clientX - r.left) * sc - M) / S, gy = ((ev.clientY - r.top) * sc - M) / S; let next = null;
  if (gx >= 0 && gy >= 0 && gx < W && gy < H) {
    let best = null, bd = 1e9; for (const s of POL.sects) { const d = Math.hypot(gx - s.x, gy - s.y), near = d <= 9, inside = s.reach > 0 && d <= s.reach; if ((near || inside) && (near ? d - 100 : d) < bd) { bd = near ? d - 100 : d; best = s; } }
    if (best) next = { type: "sect", id: best.id };
    else { let bc = null, cd = 1e9; for (const c of CD.cells) { const q = (c.x - gx) ** 2 + (c.y - gy) ** 2; if (q < cd) { cd = q; bc = c; } } if (bc && TER.land[bc.id]) next = { type: "polity", id: POL.cellPol[bc.id], cell: bc.id }; }
  }
  sel = sel && next && sel.type === next.type && sel.id === next.id && sel.cell === next.cell ? null : next; overlay();
});

// ---------- 七、控制 ----------
function generate(full) {
  const seed = +document.getElementById("seed").value | 0, mode = document.getElementById("mode").value, count = +document.getElementById("c").value;
  const t0 = performance.now();
  if (full || !CD || CD.count !== count || CD.seed !== seed) { CD = genCells(seed, count); CD.count = count; CD.seed = seed; buildRings(CD, seed); }
  TER = genTerrain(seed, mode, CD); POL = genPolitics(CD, TER, +document.getElementById("n").value, +document.getElementById("p").value); sel = null;
  renderBase();
  document.getElementById("stat").textContent = `格網 ${CD.ms.toFixed(0)} ms ・ 地形 ${TER.ms.toFixed(0)} ms ・ 省與國 ${POL.ms.toFixed(0)} ms ・ 繪製 ${R.ms.toFixed(0)} ms ・ 合計 ${(performance.now() - t0).toFixed(0)} ms ・ ${CD.cells.length} 格（陸地 ${TER.land.reduce((a, b) => a + b, 0)}）・ ${POL.n} 省`;
}
const legend = document.getElementById("legend"); for (const b of BIOMES) { const d = document.createElement("div"); d.className = "chip"; d.innerHTML = `<span class="sw" style="background:rgb(${b.c})"></span>${b.name}`; legend.append(d); }
document.getElementById("roll").onclick = () => { document.getElementById("seed").value = (Math.random() * 99999) | 0; generate(true); };
document.getElementById("mode").onchange = () => generate(false);
document.getElementById("seed").onchange = () => generate(true);
for (const [id, out] of [["n", "nv"], ["p", "pv"], ["c", "cv"]]) { const el = document.getElementById(id); el.oninput = e => { document.getElementById(out).textContent = e.target.value; }; el.onchange = () => generate(id === "c"); }
for (const id of ["nation", "terrain", "river", "sect", "symbol", "cells"]) document.getElementById("L_" + id).onchange = () => renderBase();
generate(true);
</script>
