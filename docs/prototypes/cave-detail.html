<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>洞府細緻化原型</title>
<style>
  :root {
    --bg: #0e1116; --panel: #171b22; --text: #e8e4d6; --muted: #9aa0ab; --line: #2b313c; --accent: #c9a45c;
    --sky-top: #14222a; --sky-bottom: #28434a; --orb: #d9d2b4; --far: #23393f; --mid: #1b2d33; --near: #131f24;
    --figure: #0d1015; --qi: #c9a45c; --warm: #c98f4e; --ink: #8f9aae; --hair: #cfcabb;
  }
  :root[data-realm="zhuji"] { --sky-top:#1d1a2c; --sky-bottom:#3b3456; --far:#322d4a; --mid:#28243b; --near:#1a1727; --orb:#e3d6b8; --qi:#d8c38d; }
  :root[data-realm="jindan"] { --sky-top:#2a1f14; --sky-bottom:#5a4224; --far:#4a3822; --mid:#382a19; --near:#221a10; --orb:#f0d9a0; --qi:#f0cf86; }
  :root[data-realm="yuanying"] { --sky-top:#101635; --sky-bottom:#2c3a73; --far:#232f63; --mid:#1a234c; --near:#101635; --orb:#f2eed8; --qi:#b9c8f2; }
  :root[data-night="1"] { --sky-top:#070a12; --sky-bottom:#121a2a; --orb:#c9cfe0; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.6 "Noto Serif TC", "PingFang TC", "Microsoft JhengHei", serif; }
  main { max-width: 980px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.1rem; margin: 0 0 4px; color: var(--accent); }
  p.sub { margin: 0 0 12px; color: var(--muted); }
  .controls { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0; align-items: center; }
  .controls label, .controls button { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; font: inherit; cursor: pointer; }
  .controls select { background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; padding: 6px; font: inherit; }
  .controls button[aria-pressed="true"] { border-color: var(--accent); }

  /* 舞台：透視容器 */
  .stage { position: relative; aspect-ratio: 16 / 9; max-height: 70vh; margin: 0 auto; overflow: hidden; border: 1px solid var(--line); border-radius: 10px; background: var(--figure); perspective: 900px; perspective-origin: 50% 55%; touch-action: pan-y; user-select: none; }
  .room { position: absolute; inset: 0; transform-style: preserve-3d; transition: transform 700ms cubic-bezier(.2,.7,.2,1); transform: rotateX(calc(var(--py) * -1.2deg)) rotateY(calc(var(--px) * 1.6deg)); }
  .view { position: absolute; inset: -4%; opacity: 0; pointer-events: none; transition: opacity 600ms ease, transform 700ms cubic-bezier(.2,.7,.2,1); transform: translateX(10%) rotateY(-28deg) scale(1.06); transform-origin: 50% 50%; }
  .view.on { opacity: 1; pointer-events: auto; transform: none; }
  .view.out-left { transform: translateX(-10%) rotateY(28deg) scale(1.06); }
  .view svg { width: 100%; height: 100%; display: block; }

  /* 視差：每層依深度位移，近的動得多 */
  .L { transform: translate(calc(var(--px) * var(--d) * -22px), calc(var(--py) * var(--d) * -12px)); transition: transform 120ms linear; }
  .L.far { --d: 0.2; } .L.mid { --d: 0.6; } .L.near { --d: 1.3; } .L.front { --d: 2.1; }

  .cv-wall { fill: var(--mid); } .cv-floor { fill: var(--near); } .cv-sky { fill: var(--sky-bottom); }
  .cv-frame { fill: none; stroke: var(--figure); stroke-width: 14; }
  .sc-orb { fill: var(--orb); } .sc-halo { fill: var(--orb); opacity: .12; } .sc-far { fill: var(--far); } .sc-mid { fill: var(--mid); } .sc-near { fill: var(--near); }
  .cv-seat, .cv-sleeve, .cv-shelf, .cv-table, .cv-furnace { fill: var(--figure); } .cv-seat { opacity: .85; }
  .cv-furnace { stroke: var(--figure); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; }
  .cv-hand { fill: var(--ink); opacity: .85; }
  .cv-herb { fill: none; stroke: var(--ink); stroke-width: 3; stroke-linecap: round; opacity: .7; }
  .cv-mouth { fill: var(--near); } .cv-fire, .cv-fireglow { display: none; }
  :root[data-brew="1"] .cv-fire { display: block; fill: var(--warm); animation: flicker 1.6s ease-in-out infinite; }
  :root[data-brew="1"] .cv-fireglow { display: block; fill: var(--warm); opacity: .2; }
  .sc-smoke { display: none; fill: var(--orb); opacity: 0; animation: smoke 3.2s ease-out infinite; animation-delay: var(--d2); }
  :root[data-brew="1"] .sc-smoke { display: block; }
  .cv-bottle, .cv-bag { fill: var(--figure); stroke: var(--ink); stroke-width: 2; }
  .cv-bagtie { fill: none; stroke: var(--ink); stroke-width: 3; }
  .cv-scroll { fill: var(--ink); opacity: .8; } .cv-scrollend { fill: var(--figure); stroke: var(--ink); stroke-width: 1.5; }
  .cv-hang { stroke: var(--ink); stroke-width: 2; fill: none; }
  .sc-lantern { fill: var(--warm); opacity: .9; animation: flicker 2.4s ease-in-out infinite; }
  .cv-tree { fill: none; stroke: var(--figure); stroke-width: 6; stroke-linecap: round; opacity: .85; }
  .cv-sign { fill: var(--figure); stroke: var(--ink); stroke-width: 2; } .cv-signpost { stroke: var(--figure); stroke-width: 8; }
  .sc-aura { fill: none; stroke: var(--qi); stroke-width: 1.2; opacity: .7; animation: breathe 3.6s ease-in-out infinite; transform-box: fill-box; transform-origin: center; }
  .sc-aura-outer { stroke-width: .7; opacity: .35; animation-delay: .8s; }
  .sc-qi { fill: var(--qi); opacity: 0; animation: rise 3.6s ease-out infinite; animation-delay: var(--d2); }
  .glow { fill: var(--warm); opacity: 0; pointer-events: none; mix-blend-mode: screen; transition: opacity .6s; }
  :root[data-brew="1"] .glow { opacity: .14; }
  .stars { opacity: 0; transition: opacity .6s; } :root[data-night="1"] .stars { opacity: .9; }
  .fire-wall { transition: opacity .6s; } :root[data-brew="1"] .fire-wall { opacity: .35 !important; }
  .cv-fire.sparks { animation: flicker .9s ease-in-out infinite; }
  .smoke-thread { animation: sway 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
  @keyframes sway { 0%,100% { transform: skewX(-4deg); } 50% { transform: skewX(5deg); } }
  @keyframes flicker { 0%,100% { opacity: .55 } 50% { opacity: 1 } }
  @keyframes smoke { 0% { transform: translateY(0) scale(.6); opacity: 0 } 25% { opacity: .35 } 100% { transform: translateY(-70px) scale(1.8); opacity: 0 } }
  @keyframes rise { 0% { transform: translateY(0); opacity: 0 } 20% { opacity: .9 } 100% { transform: translateY(-34px); opacity: 0 } }
  @keyframes breathe { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

  /* 熱點：滑過時上浮並微放大，像是物件靠近了 */
  .hot { cursor: pointer; outline: none; }
  .hot .hit { fill: transparent; stroke: transparent; stroke-width: 3; stroke-dasharray: 10 8; transition: all .25s; }
  .hot .item { transition: transform .35s cubic-bezier(.2,.7,.2,1); transform-box: fill-box; transform-origin: 50% 100%; }
  .hot:hover .item, .hot:focus-visible .item { transform: translateY(-8px) scale(1.05); }
  .hot:hover .hit, .hot:focus-visible .hit { stroke: var(--qi); fill: var(--qi); fill-opacity: .08; }
  .cap rect { fill: var(--sky-top); opacity: .88; } .cap text { fill: var(--orb); font-size: 24px; pointer-events: none; }

  .turn { position: absolute; top: 50%; transform: translateY(-50%); width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--sky-top); color: var(--orb); font-size: 1.4rem; cursor: pointer; opacity: .85; z-index: 3; }
  .turn.l { left: 10px; } .turn.r { right: 10px; }
  .name { position: absolute; top: 8px; left: 50%; transform: translateX(-50%); padding: 0 12px; border-radius: 999px; background: var(--sky-top); color: var(--orb); font-size: .85rem; opacity: .85; z-index: 3; }
  .vignette { position: absolute; inset: 0; z-index: 2; pointer-events: none; background: radial-gradient(ellipse at 50% 55%, transparent 55%, rgba(0,0,0,.55) 100%); }
  .toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); background: var(--panel); border: 1px solid var(--accent); border-radius: 8px; padding: 6px 14px; opacity: 0; transition: opacity .3s; z-index: 4; pointer-events: none; }
  .toast.show { opacity: 1; }
  .note { color: var(--muted); font-size: .9rem; margin-top: 10px; }
  @media (prefers-reduced-motion: reduce) { .room, .view, .L, .sc-aura, .sc-qi, .sc-smoke, .cv-fire, .sc-lantern { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <filter id="grain" x="0" y="0" width="100%" height="100%"><feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" seed="3"/><feColorMatrix type="matrix" values="0 0 0 0 .5  0 0 0 0 .5  0 0 0 0 .5  0 0 0 1.4 -.35"/></filter>
  <filter id="rock" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".025 .06" numOctaves="3" seed="7"/><feDisplacementMap in="SourceGraphic" scale="14"/></filter>
  <filter id="ink" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency=".05" numOctaves="2" seed="2"/><feDisplacementMap in="SourceGraphic" scale="4"/></filter>
  <filter id="blur4"><feGaussianBlur stdDeviation="4"/></filter><filter id="blur12" x="-30%" y="-100%" width="160%" height="300%"><feGaussianBlur stdDeviation="12"/></filter>
  <linearGradient id="wallGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--near)"/><stop offset=".55" style="stop-color:var(--mid)"/><stop offset="1" style="stop-color:var(--near)"/></linearGradient>
  <linearGradient id="floorGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--mid)"/><stop offset="1" style="stop-color:var(--figure)"/></linearGradient>
  <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-top)"/><stop offset="1" style="stop-color:var(--sky-bottom)"/></linearGradient>
  <linearGradient id="skyGradDay" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--sky-top)"/><stop offset=".7" style="stop-color:var(--sky-bottom)"/><stop offset="1" style="stop-color:var(--orb);stop-opacity:.35"/></linearGradient>
  <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:var(--orb);stop-opacity:.55"/><stop offset="1" style="stop-color:var(--orb);stop-opacity:0"/></linearGradient>
  <radialGradient id="seal"><stop offset="0" style="stop-color:var(--qi);stop-opacity:.6"/><stop offset="1" style="stop-color:var(--qi);stop-opacity:0"/></radialGradient>
  <radialGradient id="fireLight"><stop offset="0" style="stop-color:var(--warm);stop-opacity:.8"/><stop offset="1" style="stop-color:var(--warm);stop-opacity:0"/></radialGradient>
  <radialGradient id="fireCore"><stop offset="0" style="stop-color:var(--orb)"/><stop offset=".45" style="stop-color:var(--warm)"/><stop offset="1" style="stop-color:var(--warm);stop-opacity:.2"/></radialGradient>
  <radialGradient id="lampLight"><stop offset="0" style="stop-color:var(--warm);stop-opacity:.7"/><stop offset="1" style="stop-color:var(--warm);stop-opacity:0"/></radialGradient>
  <pattern id="stone" width="120" height="60" patternUnits="userSpaceOnUse"><path d="M0 0 H120 M0 30 H120 M60 0 V30 M0 30 V60 M120 30 V60" stroke="var(--figure)" stroke-width="2" fill="none" opacity=".35"/></pattern>
</defs></svg>
<main>
  <h1>洞府細緻化原型（含偽 3D）</h1>
  <p class="sub">滑鼠在畫面上移動（手機可傾斜或拖曳）會有視差與微小的透視轉動；按左右箭頭、鍵盤方向鍵或左右滑動轉身，轉身時視角會旋轉過去。</p>
  <div class="controls" role="group" aria-label="預覽設定">
    <label>境界 <select id="realm"><option value="lianqi">練氣</option><option value="zhuji">築基</option><option value="jindan">金丹</option><option value="yuanying">元嬰</option></select></label>
    <button id="night" aria-pressed="false">夜晚</button>
    <button id="brew" aria-pressed="false">煉丹中</button>
    <button id="tilt" aria-pressed="true">視差開</button>
  </div>
  <div class="stage" id="stage" tabindex="0" aria-label="洞府">
    <div class="room" id="room"></div>
    <div class="vignette"></div>
    <button class="turn l" aria-label="向左轉身">‹</button>
    <button class="turn r" aria-label="向右轉身">›</button>
    <div class="name" id="name"></div>
    <div class="toast" id="toast"></div>
  </div>
  <p class="note">細緻化加了：石牆質感與磚縫、木地板紋、窗外光束、牆上掛畫與香爐、蒲團編織紋、袖口摺紋、丹爐的銅環與爐耳、藥罐與吊掛藥草、石案木紋與硯台、瓶身高光、卷軸文字、夜晚星空、洞口鐘乳石與霧層。這只是原型：圖用向量程式畫，沒有任何外部檔案；視差用 CSS 變數、轉身用 CSS 3D 轉場，不需要 3D 函式庫，所以不增加遊戲的檔案大小。</p>
</main>
<script>
const NAMES = { front: "面壁靜坐", right: "石案", back: "洞口", left: "丹爐" };
const ORDER = ["front", "right", "back", "left"];
const QI = [[-22,0],[-14,.9],[-6,1.8],[4,.4],[12,1.3],[20,2.2],[-18,2.6],[8,3]];
const qis = () => QI.map(([x,d]) => `<circle class="sc-qi" cx="${x}" cy="0" r="1.4" style="--d2:${d}s"/>`).join("");
const hot = (id, label, x, y, w, h, inner) => `<g class="hot" tabindex="0" role="button" data-id="${id}" aria-label="${label}">
  <g class="item">${inner}</g><rect class="hit" x="${x}" y="${y}" width="${w}" height="${h}" rx="10"/>
  <g class="cap" transform="translate(${x + w/2} ${y + h - 18})"><rect x="${-(label.length*13+11)}" y="-20" width="${label.length*26+22}" height="32" rx="16"/><text x="0" y="3" text-anchor="middle">${label}</text></g></g>`;

const wall = (extra = "") => `<rect class="cv-wall" x="-40" y="-20" width="880" height="500" fill="url(#wallGrad)"/><rect x="-40" y="-20" width="880" height="500" fill="url(#stone)" opacity=".5"/>${extra}<rect x="-40" y="-20" width="880" height="500" filter="url(#grain)" opacity=".22" style="mix-blend-mode:overlay"/>`;
const plank = (y) => `<path class="cv-floor" d="M-40 ${y} L840 ${y} L840 480 L-40 480Z" fill="url(#floorGrad)"/><path d="M-40 ${y + 26} H840 M-40 ${y + 62} H840 M-40 ${y + 108} H840 M120 ${y} L60 480 M330 ${y} L300 480 M520 ${y} L540 480 M720 ${y} L780 480" stroke="var(--figure)" stroke-width="2" opacity=".35" fill="none"/>`;
const mist = (y, o = 0.18) => `<ellipse cx="260" cy="${y}" rx="220" ry="16" fill="var(--orb)" opacity="${o}" filter="url(#blur12)"/><ellipse cx="560" cy="${y + 20}" rx="260" ry="14" fill="var(--orb)" opacity="${o * 0.8}" filter="url(#blur12)"/>`;
const stars = `<g class="stars" fill="var(--orb)"><circle cx="330" cy="70" r="1.6"/><circle cx="372" cy="46" r="1.2"/><circle cx="470" cy="62" r="1.8"/><circle cx="352" cy="108" r="1"/><circle cx="486" cy="96" r="1.2"/></g>`;
const window_ = (cx, top, bottom, half, moon = true) => `
  <path d="M${cx - half} ${bottom} V${top + 120} Q${cx} ${top - 120} ${cx + half} ${top + 120} V${bottom}Z" fill="url(#skyGrad)"/>
  ${stars}
  ${moon ? `<circle class="sc-halo" cx="${cx + 45}" cy="${top + 60}" r="46"/><circle class="sc-orb" cx="${cx + 45}" cy="${top + 60}" r="21"/><circle cx="${cx + 38}" cy="${top + 54}" r="5" fill="var(--sky-bottom)" opacity=".25"/>` : ""}
  <path class="sc-far" d="M${cx - half} ${bottom} V${bottom - 60} L${cx - 62} ${bottom - 104} L${cx - 22} ${bottom - 68} L${cx + 26} ${bottom - 118} L${cx + 70} ${bottom - 76} L${cx + half} ${bottom - 92} V${bottom}Z" filter="url(#ink)"/>
  <path class="sc-mid" d="M${cx - half} ${bottom} V${bottom - 30} Q${cx - 40} ${bottom - 54} ${cx + 10} ${bottom - 34} T${cx + half} ${bottom - 38} V${bottom}Z"/>
  ${mist(bottom - 36, 0.2)}
  <path d="M${cx} ${top - 8} V${bottom} M${cx - half} ${top + 100} H${cx + half}" stroke="var(--figure)" stroke-width="5" opacity=".8"/>
  <path class="cv-frame" d="M${cx - half} ${bottom} V${top + 120} Q${cx} ${top - 120} ${cx + half} ${top + 120} V${bottom}Z" filter="url(#ink)"/>`;

const VIEWS = {
  front: `<g class="L far">${wall()}
      ${window_(400, 130, 262, 112)}
      <polygon points="288,262 512,262 640,480 160,480" fill="url(#beam)" style="mix-blend-mode:screen" opacity=".45"/></g>
    <g class="L mid">
      <g transform="translate(80 120)"><path d="M0 0 V-18 M120 0 V-18" stroke="var(--ink)" stroke-width="2"/><rect x="0" y="0" width="120" height="170" rx="3" fill="var(--ink)" opacity=".78"/><rect x="0" y="0" width="120" height="14" fill="var(--figure)"/><rect x="0" y="156" width="120" height="14" fill="var(--figure)"/><path d="M14 126 L44 70 L64 104 L86 54 L108 126Z" fill="var(--far)" filter="url(#ink)"/><circle cx="92" cy="40" r="9" fill="var(--warm)" opacity=".7"/><path d="M20 44 H60 M20 56 H46" stroke="var(--figure)" stroke-width="3" opacity=".6"/></g>
      <g transform="translate(640 232)"><path d="M0 70 H70" stroke="var(--figure)" stroke-width="8"/><path d="M12 70 V40 Q12 28 35 28 Q58 28 58 40 V70Z" fill="var(--figure)" stroke="var(--ink)" stroke-width="2"/><rect x="26" y="20" width="18" height="8" fill="var(--figure)"/><path class="smoke-thread" d="M35 18 Q26 4 36 -10 Q46 -24 34 -40" fill="none" stroke="var(--orb)" stroke-width="3" opacity=".3" filter="url(#blur4)"/></g>
      ${plank(300)}
      <ellipse cx="400" cy="440" rx="330" ry="40" fill="#000" opacity=".28" filter="url(#blur12)"/></g>
    <g class="L near"><ellipse cx="400" cy="424" rx="262" ry="48" fill="var(--figure)" opacity=".92"/><ellipse cx="400" cy="418" rx="250" ry="42" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".35"/><ellipse cx="400" cy="418" rx="206" ry="34" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".28"/><ellipse cx="400" cy="418" rx="160" ry="26" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".22"/><ellipse cx="400" cy="418" rx="110" ry="18" fill="none" stroke="var(--ink)" stroke-width="2" opacity=".16"/></g>
    <g class="L front">${hot("focus", "運功", 300, 290, 200, 160, `
      <ellipse cx="400" cy="372" rx="120" ry="60" fill="url(#seal)" style="mix-blend-mode:screen"/>
      <path class="cv-sleeve" d="M236 450 Q276 380 350 346 L398 372 Q334 402 322 450Z" fill="var(--figure)" filter="url(#ink)"/><path d="M270 430 Q304 392 350 366 M296 440 Q324 410 360 386" stroke="var(--ink)" stroke-width="2" fill="none" opacity=".35"/>
      <path class="cv-sleeve" d="M564 450 Q524 380 450 346 L402 372 Q466 402 478 450Z" fill="var(--figure)" filter="url(#ink)"/><path d="M530 430 Q496 392 450 366 M504 440 Q476 410 440 386" stroke="var(--ink)" stroke-width="2" fill="none" opacity=".35"/>
      <rect x="338" y="350" width="26" height="9" rx="4.5" fill="var(--hair)" opacity=".4" transform="rotate(14 351 355)"/>
      <ellipse class="cv-hand" cx="386" cy="360" rx="23" ry="12"/><ellipse class="cv-hand" cx="414" cy="360" rx="23" ry="12"/>
      <path d="M378 354 Q400 342 422 354" stroke="var(--hair)" stroke-width="2" fill="none" opacity=".45"/>
      <circle class="sc-aura" cx="400" cy="350" r="54"/><circle class="sc-aura sc-aura-outer" cx="400" cy="350" r="80"/>
      <g transform="translate(400 330) scale(3.4)">${qis()}</g>`)}</g>`,

  left: `<g class="L far">${wall(`<polygon points="-40,480 320,200 560,200 840,480" fill="url(#fireLight)" style="mix-blend-mode:screen" opacity=".0" class="fire-wall"/>`)}
      <g><rect class="cv-shelf" x="50" y="134" width="250" height="12" fill="var(--figure)"/><rect class="cv-shelf" x="50" y="214" width="250" height="12" fill="var(--figure)"/>
        <path d="M70 134 V104 Q54 96 56 82 Q70 72 86 82 Q88 98 80 104 V134Z" fill="var(--figure)" stroke="var(--ink)" stroke-width="2"/><path d="M110 134 V110 Q100 100 108 88 Q124 82 134 94 Q132 104 124 110 V134Z" fill="var(--figure)" stroke="var(--ink)" stroke-width="2"/>
        <rect x="176" y="96" width="46" height="38" rx="6" fill="var(--figure)" stroke="var(--ink)" stroke-width="2"/><rect x="184" y="88" width="30" height="8" rx="3" fill="var(--ink)" opacity=".7"/>
        <path d="M70 214 Q64 178 84 170 M96 214 Q104 176 124 180 M214 214 Q208 184 228 176 M240 214 Q248 186 266 192" class="cv-herb"/>
        <path d="M150 70 V104 M150 76 Q132 92 140 112 M150 76 Q168 92 160 112" stroke="var(--ink)" stroke-width="2" fill="none"/><ellipse cx="140" cy="116" rx="6" ry="12" fill="var(--warm)" opacity=".55"/><ellipse cx="160" cy="116" rx="6" ry="12" fill="var(--warm)" opacity=".55"/></g></g>
    <g class="L mid">${plank(330)}<ellipse cx="415" cy="420" rx="260" ry="36" fill="#000" opacity=".3" filter="url(#blur12)"/><circle class="cv-fireglow" cx="415" cy="352" r="170" fill="url(#fireLight)"/>

const MSG = { focus: "運功：氣機一轉，修為 +1", furnace: "丹爐：切到煉製頁開爐", pill: "服下一顆聚氣丹", scrolls: "翻開殘卷錄", bag: "打開行囊", mouth: "洞口：換個營生（歷練、採藥、走訪）", mountain: "遠山：打開天下圖" };

const room = document.getElementById("room");
const stage = document.getElementById("stage");
const views = {};
for (const f of ORDER) {
  const d = document.createElement("div");
  d.className = "view"; d.dataset.view = f;
  d.innerHTML = `<svg viewBox="0 0 800 450" preserveAspectRatio="xMidYMax slice" aria-hidden="false">${VIEWS[f]}<rect class="glow" x="-40" y="-20" width="880" height="500"/></svg>`;
  room.appendChild(d); views[f] = d;
}
let facing = "front";
function show(next, dir) {
  Object.entries(views).forEach(([f, el]) => {
    el.classList.toggle("on", f === next);
    el.classList.toggle("out-left", f !== next && dir === "r");
  });
  facing = next;
  document.getElementById("name").textContent = `${NAMES[next]}・左右轉身`;
}
function turn(dir) {
  const i = ORDER.indexOf(facing);
  show(ORDER[(i + (dir === "r" ? 1 : ORDER.length - 1)) % ORDER.length], dir);
}
document.querySelector(".turn.l").onclick = () => turn("l");
document.querySelector(".turn.r").onclick = () => turn("r");
stage.addEventListener("keydown", (e) => { if (e.key === "ArrowLeft") turn("l"); if (e.key === "ArrowRight") turn("r"); });
show("front", "r");

// 視差：滑鼠位置（或手機陀螺儀）換成 -1..1 的偏移，丟給 CSS 變數
let tiltOn = true;
const set = (x, y) => { if (!tiltOn) { x = 0; y = 0; } stage.style.setProperty("--px", x.toFixed(3)); stage.style.setProperty("--py", y.toFixed(3)); };
set(0, 0);
stage.addEventListener("pointermove", (e) => {
  if (e.pointerType === "touch") return;
  const r = stage.getBoundingClientRect();
  set(((e.clientX - r.left) / r.width - 0.5) * 2, ((e.clientY - r.top) / r.height - 0.5) * 2);
});
stage.addEventListener("pointerleave", () => set(0, 0));
window.addEventListener("deviceorientation", (e) => { if (e.gamma == null) return; set(Math.max(-1, Math.min(1, e.gamma / 25)), Math.max(-1, Math.min(1, (e.beta - 45) / 25))); });
// 滑動轉身（觸控與手寫筆）
let sx = null;
stage.addEventListener("pointerdown", (e) => { if (e.pointerType !== "mouse") sx = e.clientX; });
stage.addEventListener("pointerup", (e) => { if (sx == null) return; const dx = e.clientX - sx; sx = null; if (Math.abs(dx) > 56) turn(dx < 0 ? "r" : "l"); });

// 熱點
const toast = document.getElementById("toast");
let t;
stage.addEventListener("click", (e) => {
  const h = e.target.closest(".hot"); if (!h) return;
  toast.textContent = MSG[h.dataset.id]; toast.classList.add("show");
  clearTimeout(t); t = setTimeout(() => toast.classList.remove("show"), 1600);
});
stage.addEventListener("keydown", (e) => { if ((e.key === "Enter" || e.key === " ") && e.target.classList?.contains("hot")) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); } });

// 預覽控制
const root = document.documentElement;
document.getElementById("realm").onchange = (e) => { root.dataset.realm = e.target.value; };
for (const [id, attr] of [["night", "night"], ["brew", "brew"]]) {
  const b = document.getElementById(id);
  b.onclick = () => { const on = b.getAttribute("aria-pressed") !== "true"; b.setAttribute("aria-pressed", String(on)); root.dataset[attr] = on ? "1" : "0"; };
}
document.getElementById("tilt").onclick = (e) => { tiltOn = !tiltOn; e.target.setAttribute("aria-pressed", String(tiltOn)); e.target.textContent = tiltOn ? "視差開" : "視差關"; set(0, 0); };
</script>
